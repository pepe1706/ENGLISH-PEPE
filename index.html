html.zl{--fz:1.12}html.zxl{--fz:1.25}
 *{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:calc(15px*var(--fz));line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:84px}
.hidden{display:none!important}

/* ---------- top band ---------- */
.band{background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%);color:#F3F5FA;padding:18px 18px 22px;position:relative;overflow:hidden}
.band h1{font-family:var(--serif);font-weight:600;font-size:calc(26px*var(--fz));line-height:1.15;margin:0;letter-spacing:-.01em}
.band .sub{color:#B9C3DC;font-size:calc(13px*var(--fz));margin-top:4px}
.band .back{background:rgba(255,255,255,.1);border:0;border-radius:7px;padding:6px 11px;color:#fff;font-size:calc(13px*var(--fz));margin-bottom:10px}
.band.compact{padding:14px 18px 16px}
.band.compact h1{font-size:calc(21px*var(--fz))}
.route{margin:14px -4px 0;display:block;width:calc(100% + 8px);height:auto}
.route-labels{display:flex;justify-content:space-between;font-size:calc(11px*var(--fz));color:#9FB0D6;letter-spacing:.08em;margin-top:-2px}
.route-labels b{color:#fff;font-weight:700}

/* ---------- layout ---------- */
.page{padding:14px 16px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 12px;box-shadow:var(--shadow)}
.section-title{font-size:calc(11px*var(--fz));font-weight:800;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin:0 0 8px}
.h2{font-family:var(--serif);font-size:calc(19px*var(--fz));font-weight:600;margin:0 0 4px}
.muted{color:var(--muted)} .small{font-size:calc(13px*var(--fz))} .tiny{font-size:calc(11.5px*var(--fz))}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt{margin-top:10px}.mb0{margin-bottom:0}
.empty{text-align:center;color:var(--muted);padding:30px 10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:8px;background:var(--btn);color:#fff;padding:11px 16px;font-weight:700;min-height:44px}
.btn svg{width:18px;height:18px;flex:none}
.btn.amber{background:var(--amber);color:#1B1300}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.soft{background:var(--blue-soft);color:var(--blue)}
.btn.danger{background:var(--coral-soft);color:var(--coral)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;font-size:calc(13px*var(--fz));font-weight:600;min-height:34px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.lv{display:inline-block;font-size:calc(11px*var(--fz));font-weight:800;border-radius:6px;padding:2px 6px;color:#fff;letter-spacing:.04em}
.lv.A1{background:var(--a1)}.lv.A2{background:var(--a2)}.lv.B1{background:var(--b1)}.lv.B2{background:var(--b2)}
.badge{display:inline-block;font-size:calc(11.5px*var(--fz));font-weight:700;border-radius:10px;padding:2px 9px;background:var(--blue-soft);color:var(--blue)}
.badge.ok{background:var(--green-soft);color:var(--green)}
.badge.warn{background:var(--amber-soft);color:#9A5B00}
.search{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:11px 13px;margin:0 0 10px;outline:none}
.search:focus{border-color:var(--blue)}
select.sel{border:1.5px solid var(--line);background:var(--card);border-radius:7px;padding:8px 10px;max-width:100%}
.progress{height:7px;background:var(--line);border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--amber);border-radius:6px}

/* ---------- bottom nav ---------- */
.nav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,560px);display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:calc(11px*var(--fz));font-weight:700;color:var(--muted);padding:5px 0;min-height:52px}
.nav button svg{width:23px;height:23px}
.nav button.on{color:var(--ink)}
.nav button.on svg{color:var(--amber)}
.nav .dot{position:absolute;margin-left:18px;margin-top:-2px;background:var(--coral);color:#fff;border-radius:6px;font-size:calc(10px*var(--fz));padding:0 5px;line-height:16px}

/* ---------- home ---------- */
.continue{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.continue .code{font-family:var(--mono);font-size:calc(12px*var(--fz));color:var(--muted)}
.continue .ttl{font-family:var(--serif);font-size:calc(18px*var(--fz));font-weight:600;line-height:1.25;margin:2px 0}
.goal{display:flex;gap:14px;align-items:center}
.ring{width:66px;height:66px;flex:none;border:0;background:none;padding:0;position:relative}
.ring svg{width:66px;height:66px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(15px*var(--fz))}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats3 b{display:block;font-size:calc(20px*var(--fz));font-family:var(--serif)}
.stats3 span{font-size:calc(11.5px*var(--fz));color:var(--muted)}
.level-group{margin:0 0 10px}
.level-group>summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow)}
.level-group>summary::-webkit-details-marker{display:none}
.level-group[open]>summary{border-bottom-left-radius:0;border-bottom-right-radius:0}
.level-group .lrows{border:1px solid var(--line);border-top:0;border-radius:0 0 9px 9px;background:var(--card);overflow:hidden}
.lrow{display:grid;grid-template-columns:54px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 12px}
.lrow:first-child{border-top:0}
.lrow .c{font-family:var(--mono);font-size:calc(12px*var(--fz));color:var(--muted)}
.lrow .t{font-weight:600;font-size:calc(14px*var(--fz));line-height:1.3}
.lrow .s{font-size:calc(12px*var(--fz));color:var(--muted)}
.lrow.cur{background:var(--amber-soft)}
.mark{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:calc(12px*var(--fz));font-weight:800;border:2px solid var(--line);color:var(--muted)}
.mark.done{background:var(--green);border-color:var(--green);color:#fff}
.mark.part{border-color:var(--amber);color:#9A5B00}

/* ---------- lesson ---------- */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.tabs button{background:none;border:0;padding:12px 2px 10px;font-weight:700;font-size:calc(13.5px*var(--fz));color:var(--muted);border-bottom:3px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--amber)}
.tabs button .ck{color:var(--green);font-size:calc(12px*var(--fz));margin-left:3px}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.line{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:11px 12px;border-radius:9px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;cursor:pointer}
.line.playing{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(13px*var(--fz));color:#fff;background:#7A859F}
.line .who{font-size:calc(11.5px*var(--fz));font-weight:700;color:var(--muted);margin-bottom:1px}
.line .en{font-size:calc(16px*var(--fz));line-height:1.45}
.line .vi{font-size:calc(13.5px*var(--fz));color:var(--ink2);margin-top:3px}
.line .en.masked{filter:blur(6px);user-select:none}
.line.reveal .en.masked{filter:none}
.hl{background:none;border:0;padding:0;font:inherit;color:inherit;border-bottom:2px solid var(--amber);cursor:pointer}
.lead{font-size:calc(13.5px*var(--fz));color:var(--ink2)}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin:0 0 10px}
.vtop{display:flex;align-items:flex-start;gap:10px}
.vword{font-family:var(--serif);font-size:calc(22px*var(--fz));font-weight:600;line-height:1.15}
.ipa{font-family:var(--mono);font-size:calc(13px*var(--fz));color:var(--blue)}
.pos{font-size:calc(12px*var(--fz));color:var(--muted);font-style:italic}
.vmean{font-size:calc(15px*var(--fz));margin:4px 0 2px}
.ex{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;margin-top:8px}
.ex .e{font-size:calc(14.5px*var(--fz))}.ex .v{font-size:calc(13px*var(--fz));color:var(--muted)}
.note{font-size:calc(13px*var(--fz));border-left:3px solid var(--amber);background:var(--amber-soft);padding:7px 10px;border-radius:0 6px 6px 0;margin-top:8px}
.note.err{border-left-color:var(--coral);background:var(--coral-soft)}
.note.us{border-left-color:var(--blue);background:var(--blue-soft)}
.kv{font-size:calc(13px*var(--fz));margin-top:6px}.kv b{color:var(--muted);font-weight:700}
.snd{flex:none;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.snd svg{width:17px;height:17px}
.snd.mini{width:28px;height:28px}.snd.mini svg{width:14px;height:14px}
.star{border:0;background:none;font-size:calc(20px*var(--fz));color:var(--line);padding:2px 4px}
.star.on{color:var(--amber)}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 0 10px;overflow:hidden}
.gcard>summary{list-style:none;padding:13px 14px;cursor:pointer}
.gcard>summary::-webkit-details-marker{display:none}
.gcard[open]>summary{border-bottom:1px solid var(--line)}
.gname{font-weight:700;font-size:calc(15px*var(--fz));line-height:1.35}
.gbody{padding:12px 14px}
.formula{font-family:var(--mono);font-size:calc(13px*var(--fz));background:var(--blue-soft);color:var(--ink);border-radius:6px;padding:8px 10px;white-space:pre-wrap}
.stepbar{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--green-soft);border-radius:8px;padding:10px 12px;margin:6px 0 12px;font-size:calc(13.5px*var(--fz))}

/* ---------- practice ---------- */
.ptype{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:11px 12px;margin:0 0 8px}
.ptype .ic{width:40px;height:40px;border-radius:7px;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(15px*var(--fz))}
.ptype .ic.amber{background:var(--amber-soft);color:#9A5B00}.ptype .ic.coral{background:var(--coral-soft);color:var(--coral)}.ptype .ic.green{background:var(--green-soft);color:var(--green)}
.ptype b{display:block;font-size:calc(14.5px*var(--fz))}.ptype span{font-size:calc(12.5px*var(--fz));color:var(--muted)}

/* ---------- quiz ---------- */
.qtop{display:flex;align-items:center;gap:10px;padding:12px 16px;position:sticky;top:0;background:var(--bg);z-index:10}
.qtop .bar{flex:1;height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.qtop .bar i{display:block;height:100%;background:var(--amber)}
.qtop .back{border:0;background:var(--card);border-radius:7px;padding:7px 11px;font-weight:700;font-size:calc(13px*var(--fz))}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 16px;margin:4px 16px 14px;text-align:center;box-shadow:var(--shadow)}
.qkind{font-size:calc(11px*var(--fz));font-weight:800;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.qprompt{font-family:var(--serif);font-size:calc(25px*var(--fz));font-weight:600;line-height:1.25;margin:10px 0 6px}
.qprompt.long{font-size:calc(19px*var(--fz));font-family:var(--sans);font-weight:600}
.qsub{color:var(--muted);font-size:calc(14px*var(--fz))}
.opts{display:grid;gap:9px;padding:0 16px}
.opt{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:9px;padding:13px 14px;font-size:calc(15px*var(--fz));min-height:50px}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--coral);background:var(--coral-soft)}
.opt:disabled{cursor:default;color:var(--ink)}
.play{width:66px;height:66px;border-radius:50%;border:0;background:var(--btn);color:#fff;display:inline-flex;align-items:center;justify-content:center;margin:6px 4px}
.play svg{width:28px;height:28px}
.play.slow{width:48px;height:48px;background:var(--blue-soft);color:var(--blue);font-size:calc(11px*var(--fz));font-weight:800}
.tiles{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;padding:0 16px;margin:0 0 12px}
.tile{border:1.5px solid var(--line);background:var(--card);border-radius:7px;padding:8px 11px;font-size:calc(15px*var(--fz));min-height:42px}
.tile.used{opacity:.25}
.answer-zone{min-height:62px;margin:0 16px 12px;border:2px dashed var(--line);border-radius:9px;padding:8px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start}
.answer-zone .tile{background:var(--blue-soft);border-color:transparent}
.typebox{display:block;width:calc(100% - 32px);margin:0 16px 12px;border:1.5px solid var(--line);border-radius:9px;padding:12px;min-height:86px;background:var(--card);resize:vertical}
.feedback{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,560px);padding:14px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
.feedback.good{background:var(--green-soft)}.feedback.bad{background:var(--coral-soft)}
.feedback .fh{font-weight:800;font-size:calc(16px*var(--fz))}
.feedback.good .fh{color:var(--green)}.feedback.bad .fh{color:var(--coral)}
.feedback .fx{font-size:calc(13.5px*var(--fz));margin:4px 0 10px;color:var(--ink2)}
.diff .ok{color:var(--green);font-weight:700}.diff .no{color:var(--coral);text-decoration:line-through}.diff .miss{color:#9A5B00;font-weight:700}
.srs-face{min-height:200px;display:flex;flex-direction:column;justify-content:center}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:0 16px}
.grades button{border:0;border-radius:8px;padding:10px 4px;font-weight:800;font-size:calc(13.5px*var(--fz));min-height:56px;line-height:1.15}
.grades small{display:block;font-weight:600;font-size:calc(11px*var(--fz));opacity:.8}
.g0{background:var(--coral-soft);color:var(--coral)}.g3{background:var(--amber-soft);color:#9A5B00}.g4{background:var(--green-soft);color:var(--green)}.g5{background:var(--blue-soft);color:var(--blue)}
.score{font-family:var(--serif);font-size:calc(54px*var(--fz));font-weight:600;line-height:1}
.wrongitem{border-top:1px solid var(--line);padding:9px 0;font-size:calc(13.5px*var(--fz))}

/* ---------- me ---------- */
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:calc(14px*var(--fz))}
.set:first-of-type{border-top:0}
.bars{display:flex;gap:6px;align-items:flex-end;height:70px;margin-top:6px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:calc(10.5px*var(--fz));color:var(--muted)}
.bars i{display:block;width:100%;background:var(--amber);border-radius:5px 5px 2px 2px;min-height:2px}

/* ---------- modal & toast ---------- */
.modalbg{position:fixed;inset:0;z-index:40;background:rgba(10,16,32,.5);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg);width:min(100%,560px);max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.modal .x{border:0;background:var(--card);border-radius:7px;padding:6px 11px;font-weight:700}
.toast{position:fixed;z-index:50;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;font-size:calc(14px*var(--fz));box-shadow:var(--shadow);max-width:90%}

/* ---------- import ---------- */
.import{padding:28px 18px}
.drop{border:2px dashed var(--line);border-radius:12px;background:var(--card);padding:28px 16px;text-align:center}
.drop input{display:none}
.drop .big{font-family:var(--serif);font-size:calc(20px*var(--fz));font-weight:600;margin:8px 0 4px}
.err{color:var(--coral);font-weight:600}


/* =====================================================================
   Giao diện v3 (2026-11-10): "Bản đồ phiêu lưu" trong khu vườn sinh thái · chỉ giao diện sáng
   ===================================================================== */

b,strong{font-weight:800}

.band.compact{padding:16px 18px 20px}.band.compact h1{font-size:calc(24px*var(--fz));line-height:1.2;padding-right:70px}

.band .pc{position:absolute;right:70px;bottom:2px;z-index:2}
.page{padding:14px 16px 8px}
.card{border:1.5px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.section-title{font-weight:900;letter-spacing:.09em;color:var(--pd)}
.h2{font-family:var(--sans);font-weight:900}
.muted{color:var(--muted)}
.btn{border-radius:10px;font-weight:900;background:var(--p);box-shadow:0 3px 0 var(--pd);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--pd)}
.btn.amber{background:var(--acc);color:#fff;box-shadow:0 3px 0 var(--accd)}
.btn.ghost{background:#fff;color:var(--pd);border:2px solid var(--line);box-shadow:0 2px 0 var(--line)}
.btn.soft{background:var(--ps);color:var(--pd);box-shadow:0 2px 0 #BFE6CC}
.btn.danger{background:var(--coral-soft);color:var(--coral);box-shadow:0 2px 0 #F6C5BA}
.btn.big{min-height:52px;font-size:calc(16.5px*var(--fz))}
.btn:disabled{box-shadow:none}
.chip{border:2px solid var(--line);font-weight:800;color:var(--ink2);border-radius:10px}
.chip.on{background:var(--p);border-color:var(--p);color:#fff;box-shadow:0 1px 0 var(--pd)}
.search,select.sel{border:2px solid var(--line);border-radius:9px;font-weight:700}
.search:focus{border-color:var(--p)}
.lv{border-radius:8px;font-weight:900}
.badge{font-weight:800;background:var(--ps);color:var(--pd)}
.badge.warn{background:#FFF0D6;color:#B45309}
.mark{font-weight:900}
.progress i{background:var(--p)}
/* nav */
.nav{background:#fff;border-top:1.5px solid var(--line);backdrop-filter:none;-webkit-backdrop-filter:none;padding:6px 6px calc(10px + env(safe-area-inset-bottom))}
.nav button{color:var(--muted);font-weight:800;border-radius:9px;margin:0 3px}
.nav button.on{color:var(--pd);background:var(--ps)}
.nav button.on svg{color:var(--pd)}
.nav .dot{background:var(--acc);font-weight:900}
/* home: bản đồ */
.band.home{padding:14px 14px 70px}
.tchips{display:flex;gap:6px;flex-wrap:wrap;padding-right:62px}.tchips span{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.9);border:1.5px solid rgba(0,0,0,.06);border-radius:10px;padding:4px 10px;font-size:calc(13px*var(--fz));font-weight:700}
.unit{margin-top:10px;background:var(--p);color:#fff;border-radius:12px;padding:10px 14px;box-shadow:0 3px 0 var(--pd)}.unit b{display:block;font-size:calc(16px*var(--fz));font-weight:900}.unit span{font-size:calc(12.5px*var(--fz));opacity:.95}
.ub{height:9px;background:rgba(255,255,255,.3);border-radius:6px;margin-top:6px;overflow:hidden}.ub s{display:block;height:100%;background:repeating-linear-gradient(45deg,#FFD15C 0 8px,#FFE08A 8px 16px);border-radius:6px}
.quick{display:flex;gap:6px;margin-top:10px}.quick button{flex:1;border:0;background:#fff;border-radius:9px;padding:8px 4px;font-size:calc(12.5px*var(--fz));font-weight:800;color:var(--ink2);box-shadow:0 2px 0 rgba(46,120,70,.15)}.quick b{color:var(--pd)}
.lvtabs{display:flex;gap:6px;padding:10px 16px 0;position:relative;z-index:2;margin-top:-30px}.lvtabs button{flex:1;border:0;background:#fff;border-radius:10px;padding:7px 0;font-weight:900;color:var(--muted);box-shadow:0 2px 0 var(--line)}
.lvtabs button.on{background:var(--acc);color:#fff;box-shadow:0 2px 0 var(--accd)}
#view[data-page="home"]{background:linear-gradient(var(--h1,#FFF9EF) 0,var(--h2,#D8F0DA) 160px,var(--h3,#C6E9CC) 100%)}
.map{position:relative;margin:4px 0 0;overflow:hidden}
.mpath{position:absolute;left:0;top:0;width:100%;height:100%}
.nd{position:absolute;width:62px;height:56px;margin:-28px 0 0 -31px;border:0;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:calc(19px*var(--fz));background:#EEF2F6;color:#8A96A8;box-shadow:0 4px 0 #C9D2DE;z-index:2;cursor:pointer;padding:0}
.nd span{line-height:1}
.nd.part{background:#E2F5E8;color:var(--pd);box-shadow:0 4px 0 #A9D9B8}
.nd.done{background:linear-gradient(#FFD764,#FFC233);color:#7A4B00;box-shadow:0 4px 0 #D99412}
.nd.done em{position:absolute;bottom:-21px;left:50%;transform:translateX(-50%);display:flex}
.nd.cur{background:var(--p);color:#fff;width:74px;height:66px;margin:-33px 0 0 -37px;font-size:calc(24px*var(--fz));box-shadow:0 4px 0 var(--pd),0 0 0 7px rgba(255,255,255,.75);z-index:3}
.nd:active{transform:translateY(3px)}
.ncode{position:absolute;transform:translateX(-50%);font-size:calc(10.5px*var(--fz));font-weight:800;color:#3F6B4E;background:rgba(255,255,255,.7);padding:0 6px;border-radius:10px;z-index:1;white-space:nowrap}
.nd.done+.ncode{top:auto!important;display:none}
.glow{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:radial-gradient(rgba(255,255,255,.95),rgba(255,255,255,0) 68%);z-index:1;animation:pulse 2.4s ease-in-out infinite}
.pm{position:absolute;transform:translate(-26px,-96px);z-index:4;pointer-events:none}
.tip{position:absolute;z-index:4;background:#fff;border-radius:10px;padding:8px 12px;box-shadow:0 3px 0 #CFE3D4;display:flex;flex-direction:column;gap:2px;max-width:46%}
.tip b{font-size:calc(14px*var(--fz));font-weight:900;line-height:1.25}.tip>span{font-size:calc(12px*var(--fz));color:#4E6A57;font-weight:700}
.tip .go{margin-top:4px;border:0;background:var(--acc);color:#fff;font-weight:900;font-size:calc(13px*var(--fz));border-radius:7px;padding:5px 10px;box-shadow:0 2px 0 var(--accd)}
.mdeco{position:absolute;transform:translateX(-50%);display:flex;align-items:flex-end;gap:2px;z-index:1;pointer-events:none}
.chest{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;z-index:2;pointer-events:none}.chest span{font-size:calc(11px*var(--fz));font-weight:900;background:#FFF0C7;color:#8A5A00;padding:1px 7px;border-radius:10px;box-shadow:0 1px 0 #E8CF96}
.chest.open span{background:#E2F5E8;color:var(--pd);box-shadow:0 1px 0 #A9D9B8}
.mend{position:absolute;left:50%;transform:translateX(-50%);background:#fff;color:var(--pd);font-weight:900;padding:6px 14px;border-radius:10px;box-shadow:0 2px 0 #A9D9B8;white-space:nowrap}
/* lessons list */
.level-group>summary{border:1.5px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.level-group .lrows{border:1.5px solid var(--line);border-top:0}
.lrow.cur{background:#FFF4DA}
.mark.done{background:var(--p);border-color:var(--p)}
/* lesson */
.tabs{background:var(--bg);border:0;padding:10px 12px 8px;gap:6px}
.tabs button{border:0;border-radius:10px;padding:9px 2px;font-weight:800;color:var(--ink2);background:#fff;box-shadow:0 1px 0 var(--line)}
.tabs button.on{background:var(--p);color:#fff;box-shadow:0 2px 0 var(--pd)}
.tabs button .ck{color:inherit}
.toolbar .btn{min-height:40px}
.line{border:1.5px solid var(--line);border-radius:12px;box-shadow:0 1px 0 #F1E8D7}
.line.playing{border:2px solid var(--amber);background:#FFF8E6;box-shadow:0 1px 0 #F3D98F}
.line .en{font-size:calc(17px*var(--fz));font-weight:700;color:var(--ink)}
.line .vi{color:var(--ink2);font-weight:600}
.hl{border-bottom:2.5px solid var(--coral);font-weight:800}
.lead{color:var(--ink2)}
.stepbar{background:var(--ps);border-radius:9px;font-weight:700}
/* thẻ từ vựng / cụm / ngữ pháp */
.wchips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px 4px;scrollbar-width:none}.wchips::-webkit-scrollbar{display:none}
.wchips button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:5px 11px;font-size:calc(13px*var(--fz));font-weight:800;color:var(--ink2)}
.vc,.gc{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px;box-shadow:var(--shadow);scroll-margin-top:70px;position:relative}
.vh{display:flex;align-items:flex-start;gap:12px}.vn{width:30px;height:30px;border-radius:7px;background:#FFF0C7;color:#8A5A00;display:grid;place-items:center;font-weight:900;font-size:calc(13px*var(--fz));flex:none;margin-top:4px}
.vw{flex:1;min-width:0}.w1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.w1 b{font-size:calc(25px*var(--fz));font-weight:900;letter-spacing:-.01em;line-height:1.15}.w1 b.phr{font-size:calc(20px*var(--fz))}
.pos{font-size:calc(12px*var(--fz));font-weight:800;color:var(--pd);background:var(--ps);padding:2px 8px;border-radius:10px;font-style:normal}
.w2{display:flex;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap}.ipa{font-size:calc(15px*var(--fz));font-weight:700;color:var(--pd);font-family:var(--sans)}
.sy{display:inline-flex;align-items:center;gap:3px}.sy i{width:8px;height:8px;border-radius:50%;background:var(--line)}.sy i.on{width:12px;height:12px;background:var(--coral)}.sy em{font-style:normal;font-size:calc(12px*var(--fz));color:var(--muted);font-weight:700;margin-left:4px}
.vact{display:flex;flex-direction:column;align-items:center;gap:2px}
.snd{border:1.5px solid var(--line);background:var(--ps);color:var(--pd)}
.mean{margin:10px 0 2px;padding:10px 12px;border-radius:9px;background:#FFF0C7;font-size:calc(17px*var(--fz));font-weight:800;color:#6B4300}
.sl{font-size:calc(11.5px*var(--fz));font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--pd);margin:14px 0 4px}
.exr{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1.5px dashed var(--line)}.exr:first-of-type{border-top:0}
.exr .e{font-weight:700;font-size:calc(15px*var(--fz))}.exr .e b{color:var(--coral);font-weight:900}.exr .v{font-size:calc(13.5px*var(--fz));color:var(--muted)}
.kvg{display:grid;gap:6px;margin-top:10px}.kvr{display:grid;grid-template-columns:104px 1fr;gap:8px;align-items:start;padding:9px 11px;border-radius:8px;background:var(--ps)}
.kl{font-size:calc(12.5px*var(--fz));font-weight:900;color:var(--pd)}.kd{font-size:calc(14px*var(--fz));font-weight:700}
.call{margin-top:10px;padding:10px 12px;border-radius:9px;font-size:calc(14px*var(--fz));line-height:1.45;font-weight:600}.call>b:first-child{display:block;font-size:calc(12.5px*var(--fz));font-weight:900;margin-bottom:2px}
.call.err{background:var(--coral-soft);color:#7A1C20}.call.err>b:first-child{color:var(--coral)}
.call.us{background:#E3EFFF;color:#1C2F6E}.call.us>b:first-child{color:#3A62C9}
.call.usage,.call.work{background:#FFF4DA;color:#5A3A00}.call.usage>b:first-child,.call.work>b:first-child{color:#B45309}
.gc>summary{list-style:none;cursor:pointer}.gc>summary::-webkit-details-marker{display:none}
.gh{display:flex;gap:8px;align-items:center}.gcode{font-size:calc(12px*var(--fz));font-weight:900;background:#FFF0C7;color:#8A5A00;padding:3px 9px;border-radius:8px}.gcar{margin-left:auto;color:var(--muted);transition:transform .2s}.gc[open] .gcar{transform:rotate(180deg)}
.gc h3{margin:8px 0 2px;font-size:calc(19px*var(--fz));font-weight:900;line-height:1.25}.gsub{font-size:calc(13.5px*var(--fz));color:var(--muted);font-weight:700}
.gbody{padding:4px 0 0}
.ftab{border:1.5px solid var(--line);border-radius:9px;overflow:hidden}.fr{display:grid;grid-template-columns:82px 1fr;gap:10px;align-items:center;padding:8px 10px;font-size:calc(14px*var(--fz));font-weight:700}.fr.nl{grid-template-columns:1fr}.fr+.fr{border-top:1.5px solid var(--line)}
.fl{font-size:calc(11.5px*var(--fz));font-weight:900;text-align:center;padding:3px 2px;border-radius:8px;background:#EEF1F6;color:var(--ink2)}.fl.q{background:var(--ps);color:var(--pd)}.fl.a{background:#E3EFFF;color:#3A62C9}.fl.n{background:var(--coral-soft);color:var(--coral)}
.gx{font-size:calc(14.5px*var(--fz));margin:0;color:var(--ink2)}
.fix{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}.fix span{padding:7px 9px;border-radius:7px;font-size:calc(13px*var(--fz));font-weight:800}.fix .x{background:var(--coral-soft);color:var(--coral)}.fix .ok{background:var(--ps);color:var(--pd)}
.src{font-size:calc(11.5px*var(--fz));color:var(--muted);margin-top:10px}
.star{color:#E3D8C2}.star.on{color:#FFB938}
/* luyện tập */
.ptype{display:block;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin:0 0 10px;background:#fff;text-align:left;width:100%}
.ptop{display:flex;align-items:center;gap:12px}
.ptype .ic{width:44px;height:44px;border-radius:9px;flex:none;font-size:calc(16px*var(--fz));font-weight:900;display:grid;place-items:center;background:var(--ps);color:var(--pd)}
.ptype .ic.a{background:#FFF0C7;color:#B07A00}.ptype .ic.b{background:#E3EFFF;color:#3A62C9}.ptype .ic.r{background:var(--coral-soft);color:#E0533A}
.pt{flex:1;display:flex;flex-direction:column;min-width:0}.pt b{font-size:calc(15.5px*var(--fz));font-weight:900;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.pt>span{font-size:calc(12.5px*var(--fz));color:var(--muted);font-weight:600}
.play2{flex:none;font-size:calc(12.5px*var(--fz));font-weight:900;color:var(--accd);background:#FFE9D6;padding:6px 11px;border-radius:10px}
.stars{display:inline-flex;gap:1px}.stars svg{fill:#E3E7EE;stroke:#CDD4DE;stroke-width:1.2}.stars svg.on{fill:#FFC21A;stroke:#E59A00}
.sbar{display:flex;height:8px;border-radius:8px;background:#F2EDE2;overflow:hidden;margin:10px 0 7px}.sbar s{display:block;height:100%}.sbar .g{background:var(--p)}.sbar .r{background:var(--coral)}
.stat3{display:flex;gap:6px;flex-wrap:wrap}.stat3 span{font-size:calc(12px*var(--fz));font-weight:800;padding:3px 9px;border-radius:10px}
.stat3 .g{background:var(--ps);color:var(--pd)}.stat3 .r{background:var(--coral-soft);color:#D9463A}.stat3 .o{background:#F2EDE2;color:var(--ink2)}
.card.test{border-color:#F3D98F;background:linear-gradient(#FFFDF6,#fff)}.card.test.pass{border-color:#A9D9B8}
.card.test .score{font-size:calc(40px*var(--fz));color:var(--ink)}
/* quiz */
.qtop{display:flex;align-items:center;gap:10px;padding:12px 16px 6px;background:var(--bg)}
.qtop .back{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-weight:900;color:var(--muted)}
.qtop .bar{height:14px;background:#EFE7D8;border-radius:9px}.qtop .bar i{background:var(--p);border-radius:9px;box-shadow:inset 0 3px 0 rgba(255,255,255,.3)}
.qn{font-size:calc(13px*var(--fz));color:var(--muted);font-weight:700}.qn b{color:var(--ink)}
.combo{background:#FFF0D6;color:var(--accd);font-weight:900;padding:4px 10px;border-radius:10px;font-size:calc(13px*var(--fz));white-space:nowrap}
.lbtn{border:1.5px solid var(--line);background:#fff;color:var(--pd);border-radius:8px;padding:6px 10px;font-weight:900;font-size:calc(13px*var(--fz));white-space:nowrap}
.strip{display:flex;gap:6px;padding:4px 16px 6px;overflow-x:auto;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--ink2);font-size:calc(12.5px*var(--fz));font-weight:900;padding:0}
.strip .g{background:#3DBB74;border-color:#3DBB74;color:#fff}.strip .r{background:var(--coral);border-color:var(--coral);color:#fff}.strip .cur{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--acc)}
.say{display:flex;align-items:flex-end;gap:6px;padding:2px 16px 0}
.bub{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:7px 12px;font-weight:800;font-size:calc(13.5px*var(--fz));box-shadow:0 1px 0 var(--line);margin-bottom:12px}
.qcard{border:1.5px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin:6px 16px 12px;position:relative}
.qkind{font-weight:900;color:var(--pd)}
.qprompt{font-family:var(--sans);font-weight:900}.qprompt.long{font-weight:800}
.qsub.ipa{color:var(--pd);font-weight:700}
.play{background:var(--p);box-shadow:0 3px 0 var(--pd)}.play.slow{background:var(--ps);color:var(--pd);box-shadow:0 2px 0 #BFE6CC}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:12px;font-weight:800;box-shadow:0 2px 0 #F1E8D7}
.opt i{font-style:normal;width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;background:var(--ps);color:var(--pd);font-size:calc(12px*var(--fz));font-weight:900}
.opt.right{background:#E3F8EC;border-color:#3DBB74;box-shadow:0 2px 0 #2A9C5C}.opt.right i{background:#3DBB74;color:#fff}
.opt.wrong{background:var(--coral-soft);border-color:var(--coral);box-shadow:0 2px 0 #D9463A}.opt.wrong i{background:var(--coral);color:#fff}
.tile{border:2px solid var(--line);border-radius:8px;font-weight:800;box-shadow:0 2px 0 #F1E8D7}
.answer-zone{border:2px dashed #D9CBB0;background:#fff;border-radius:12px}
.answer-zone .tile{background:var(--ps);border-color:transparent;color:var(--pd);box-shadow:none}
.typebox{border:2px solid var(--line);border-radius:10px}
.qfoot{padding:12px 16px 0}
.feedback{border-radius:14px 14px 0 0;border-top:2px solid #BDEBCF;background:#E3F8EC;padding-top:16px}
.feedback.bad{background:#FFEDE8;border-top-color:#F6C5BA}
.feedback .fbm{position:absolute;right:18px;top:-34px}
.feedback .fh{font-size:calc(21px*var(--fz));font-weight:900;display:flex;align-items:center;gap:8px}
.xp{background:#FFC21A;color:#5A3A00;font-size:calc(12.5px*var(--fz));padding:2px 9px;border-radius:10px;box-shadow:0 1px 0 #E59A00}
.fbr{display:grid;grid-template-columns:1fr 1.2fr;gap:10px}
.meadow{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:18px 0 8px;opacity:.9}
/* danh sách câu & kết quả */
.qhead{display:flex;align-items:center;gap:12px;padding:14px 16px 4px}.qhead>div{flex:1;display:flex;flex-direction:column;line-height:1.25}.qhead b{font-size:calc(19px*var(--fz));font-weight:900}.qhead span{font-size:calc(13px*var(--fz));color:var(--muted);font-weight:700}
.qhead .back,.rhead .back{border:1.5px solid var(--line);background:#fff;border-radius:8px;width:40px;height:40px;font-weight:900;font-size:calc(18px*var(--fz));color:var(--ink)}
.card.sum{position:relative}
.qlist{padding:4px 14px}.qrow{display:flex;align-items:center;gap:12px;padding:9px 0;border:0;border-top:1.5px solid var(--line);background:none;width:100%;text-align:left}.qrow:first-child{border-top:0}
.qn2,.qrow .qn,.wr .qn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:calc(13px*var(--fz));font-weight:900;flex:none;background:#F2EDE2;color:var(--ink2)}
.qrow.g .qn{background:#3DBB74;color:#fff}.qrow.r .qn,.qn.r{background:var(--coral);color:#fff}
.qt{flex:1;display:flex;flex-direction:column;line-height:1.3;min-width:0}.qt b{font-weight:800;font-size:calc(15px*var(--fz));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.qt span{font-size:calc(12.5px*var(--fz));color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qs{font-weight:900;font-size:calc(17px*var(--fz))}.qrow.g .qs{color:#2A9C5C}.qrow.r .qs{color:var(--coral)}.qrow.o .qs{color:var(--muted)}
.rhead{position:relative;display:flex;align-items:center;gap:10px;padding:14px 16px 0;font-weight:800;color:var(--muted)}
.conf{position:absolute;left:0;right:0;top:56px;height:90px;pointer-events:none}.conf i{position:absolute;width:9px;height:14px;border-radius:3px;animation:fall 2.6s ease-in infinite}
.rs{text-align:center}.rst{display:flex;justify-content:center;margin-top:16px}.rst .stars svg:nth-child(2){transform:translateY(-10px) scale(1.12)}
.rh{font-size:calc(30px*var(--fz));font-weight:900;color:var(--pd);margin:6px 0 0}.rp{color:var(--ink2);margin:2px 0 0}.okc{color:var(--pd)}
.rw{display:flex;gap:8px;margin:14px 0}.rw div{flex:1;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:9px 4px;box-shadow:var(--shadow);display:flex;flex-direction:column}.rw b{font-size:calc(19px*var(--fz));font-weight:900}.rw span{font-size:calc(12px*var(--fz));color:var(--muted);font-weight:800}
.tl3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.t{border-radius:10px;padding:8px;display:flex;flex-direction:column}.t b{font-size:calc(20px*var(--fz));font-weight:900}.t span{font-size:calc(12px*var(--fz));font-weight:800}
.t.g{background:#E3F8EC;color:#1F8A4D}.t.r{background:#FFE6E2;color:#D9463A}.t.o{background:#F2EDE2;color:var(--ink2)}
.rm{display:flex;align-items:flex-end;gap:6px;margin:14px 0 4px;text-align:left}.rm .bub{margin-bottom:8px}
.wr{display:flex;gap:10px;align-items:center;padding:8px 0;border:0;border-top:1.5px solid var(--line);background:none;width:100%;text-align:left}.wr:first-of-type{border-top:0}.wr>span:last-child{display:flex;flex-direction:column;line-height:1.3}.wr b{font-weight:800}.wr span span{font-size:calc(13px*var(--fz));color:var(--muted)}.wr i{font-style:normal;color:#2A9C5C;font-weight:900}
.rs .card{text-align:left}
/* ôn tập, me, import */
.grades button{border-radius:9px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.bars i{background:var(--p)}

/* ===== v6.0 · khóa truy cập */

.modalbg.adm{z-index:9996}

/* ===== v6.2 · sửa bố cục + lá rơi ===== */
/* bản đồ: khung bài hiện tại không chạm nút kế tiếp */
.tip2{width:min(236px,calc(100% - 20px))}
/* tab Bài tập: bỏ khoảng trống thừa */
.page>.card:first-child{margin-top:0}
h2.st{margin-top:14px}
/* câu hỏi: thẻ đề bài – nhãn loại (phụ) + nút nghe ở hàng đầu, đề (chính) ở giữa */
.qz{display:block;position:relative;background:#fff;border:1.5px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin:8px 16px 12px;padding:12px 16px 16px;text-align:center}
.qz .qhd{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:38px;margin-bottom:6px}

.qz .qaud{display:flex;align-items:center;gap:8px;flex:none}
.qz .qaud .play{width:42px;height:42px;margin:0}.qz .qaud .play svg{width:20px;height:20px}
.qz .qaud .play.slow{width:auto;height:32px;padding:0 11px;border-radius:16px;font-size:calc(12px*var(--fz))}

.qz .qprompt{margin:8px 0 4px;font-size:calc(21px*var(--fz));line-height:1.35;text-align:left;overflow-wrap:anywhere}

.qz .qprompt.long{font-size:calc(18px*var(--fz));font-weight:800;text-align:left}
.qz .qsub{margin-top:2px;font-size:calc(15px*var(--fz));line-height:1.4;overflow-wrap:anywhere}
.qz .qsub.ipa{display:inline-block;margin-top:4px;padding:3px 12px;border-radius:12px;background:#F4F8F1}
/* đáp án: chữ là chính, ký hiệu A/B/C là phụ; câu dài thì xếp 1 cột */
.opt{line-height:1.3;overflow-wrap:anywhere}.opt span{flex:1;min-width:0}
.opt i{opacity:.9}
/* khung kết quả: một cột, thứ tự rõ: kết quả → đáp án → giải thích → nút */
.fbsp{height:220px}
.feedback{max-height:62vh;display:flex;flex-direction:column;gap:10px;padding:14px 16px calc(12px + env(safe-area-inset-bottom));box-sizing:border-box}
.feedback .fhead{display:flex;align-items:center;gap:10px}
.feedback .fm{flex:none;line-height:0}
.feedback .ft{flex:1;min-width:0}
.feedback .fh{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:calc(21px*var(--fz));font-weight:900;line-height:1.15}
.feedback .fpr{display:inline-flex;align-items:center;gap:6px;margin-top:3px;padding:0;border:0;background:none;font:inherit;font-size:calc(13.5px*var(--fz));font-weight:800;color:var(--ink2);text-align:left}

.feedback .snd{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:var(--pd);display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.feedback .snd svg{width:22px;height:22px}

.feedback .fans b{font-size:calc(17px*var(--fz));font-weight:900;color:var(--ink);overflow-wrap:anywhere}
.feedback .fans .you{font-size:calc(13px*var(--fz));color:var(--muted)}
.feedback .fdet{margin:0;font-size:calc(14px*var(--fz));line-height:1.45;color:var(--ink2);overflow-y:auto;min-height:0;max-height:26vh;overflow-wrap:anywhere}
.feedback .fnext{margin:0;min-height:50px;font-size:calc(16px*var(--fz))}
.feedback .flink{border:0;background:none;padding:4px 0 0;font:inherit;font-size:calc(13px*var(--fz));font-weight:800;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
/* lá rơi mờ */
#leaves{position:fixed;inset:0;z-index:100001;overflow:hidden;pointer-events:none;contain:strict}
#leaves .lf{position:absolute;top:-40px;display:block;opacity:.34;will-change:transform;animation:lfFall linear infinite}

@keyframes lfFall{from{transform:translate3d(0,-6vh,0)}to{transform:translate3d(0,112vh,0)}}
@keyframes lfSway{from{transform:translateX(0) rotate(-35deg)}to{transform:translateX(var(--sw,24px)) rotate(95deg)}}

.feedback .fm .fbm{position:static}
.feedback .fnext:focus,.feedback .fnext:focus-visible{outline:none}
.feedback .fm{width:48px;display:flex;justify-content:center;align-items:center}

/* ===== v6.3 · nút Check */
.checkbar{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,560px);box-sizing:border-box;padding:12px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1.5px solid var(--line);display:flex;flex-direction:column;gap:6px;align-items:stretch}

/* ===== v6.4 · chọn giao diện chủ đề */
.skins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.skin{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 2px 0 var(--line);position:relative}
.skin .sk-ico{font-size:calc(26px*var(--fz));line-height:1.1}
.skin b{font-size:calc(14.5px*var(--fz));font-weight:900;color:var(--ink)}
.skin small{font-size:calc(11.5px*var(--fz));color:var(--muted);font-weight:700;line-height:1.3}
.skin .sk-sw{display:flex;gap:4px;margin-top:5px}.skin .sk-sw i{width:16px;height:16px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.12)}

<script>
/* Bộ đọc .xlsx tối giản, chạy offline (ZIP + DecompressionStream + DOMParser) */
const XLSX_MINI = (() => {
  const td = new TextDecoder('utf-8');
  function u16(b, o) { return b[o] | (b[o + 1] << 8); }
  function u32(b, o) { return (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0; }

  function listZip(buf) {
    const b = new Uint8Array(buf);
    let eocd = -1;
    for (let i = b.length - 22; i >= Math.max(0, b.length - 70000); i--) {
      if (u32(b, i) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('Không phải file .xlsx hợp lệ (không tìm thấy cấu trúc ZIP).');
    const n = u16(b, eocd + 10), cdOff = u32(b, eocd + 16);
    const files = {};
    let p = cdOff;
    for (let k = 0; k < n; k++) {
      if (u32(b, p) !== 0x02014b50) break;
      const method = u16(b, p + 10), csize = u32(b, p + 20);
      const nl = u16(b, p + 28), el = u16(b, p + 30), cl = u16(b, p + 32), lho = u32(b, p + 42);
      const name = td.decode(b.subarray(p + 46, p + 46 + nl));
      files[name] = { method, csize, lho };
      p += 46 + nl + el + cl;
    }
    return { b, files };
  }

  async function inflateRaw(data) {
    if (typeof DecompressionStream === 'undefined') throw new Error('Trình duyệt quá cũ: không giải nén được file Excel. Hãy dùng Chrome, Edge hoặc Safari bản mới.');
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Blob([data]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  async function readEntry(z, name) {
    const f = z.files[name];
    if (!f) return null;
    const b = z.b, o = f.lho;
    const nl = u16(b, o + 26), el = u16(b, o + 28);
    const start = o + 30 + nl + el;
    const raw = b.subarray(start, start + f.csize);
    const out = f.method === 0 ? raw : await inflateRaw(raw);
    return td.decode(out);
  }

  function colIndex(ref) {
    let n = 0;
    for (const ch of ref) {
      const c = ch.charCodeAt(0);
      if (c >= 65 && c <= 90) n = n * 26 + (c - 64); else break;
    }
    return n - 1;
  }
  function allText(el) {
    const ts = el.getElementsByTagName('t');
    let s = '';
    for (const t of ts) s += t.textContent;
    return s;
  }

  async function read(buf) {
    const z = listZip(buf);
    const parser = new DOMParser();
    const xml = s => parser.parseFromString(s, 'application/xml');
    const wbXml = await readEntry(z, 'xl/workbook.xml');
    if (!wbXml) throw new Error('File không có workbook (không phải Excel?).');
    const relXml = await readEntry(z, 'xl/_rels/workbook.xml.rels');
    const rels = {};
    if (relXml) for (const r of xml(relXml).getElementsByTagName('Relationship')) rels[r.getAttribute('Id')] = r.getAttribute('Target');
    const ssXml = await readEntry(z, 'xl/sharedStrings.xml');
    const shared = [];
    if (ssXml) for (const si of xml(ssXml).getElementsByTagName('si')) shared.push(allText(si));
    const sheets = {};
    for (const s of xml(wbXml).getElementsByTagName('sheet')) {
      const name = s.getAttribute('name');
      const rid = s.getAttribute('r:id') || s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
      let target = rels[rid] || '';
      target = target.replace(/^\/?xl\//, '').replace(/^\//, '');
      const path = 'xl/' + target;
      const sx = await readEntry(z, path);
      if (!sx) continue;
      const doc = xml(sx);
      const rows = [];
      for (const r of doc.getElementsByTagName('row')) {
        const ri = (parseInt(r.getAttribute('r'), 10) || rows.length + 1) - 1;
        const arr = [];
        let ci = 0;
        for (const c of r.getElementsByTagName('c')) {
          const ref = c.getAttribute('r');
          if (ref) ci = colIndex(ref);
          const t = c.getAttribute('t');
          let v = null;
          if (t === 'inlineStr') v = allText(c);
          else {
            const ve = c.getElementsByTagName('v')[0];
            if (ve) {
              v = ve.textContent;
              if (t === 's') v = shared[parseInt(v, 10)] ?? '';
              else if (t === 'b') v = v === '1';
            }
          }
          arr[ci] = v;
          ci++;
        }
        rows[ri] = arr;
      }
      sheets[name] = rows.map(r => r || []);
    }
    return sheets;
  }
  return { read };
})();

/* ===== English Lab · core: dữ liệu, lưu trữ, giọng đọc, tiện ích ===== */
'use strict';
const APP_VER = '6.0';
const LEVELS = ['A1', 'A2', 'B1', 'B2'];
const PASS = 85;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ja = s => esc(JSON.stringify(String(s ?? '')));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n) => shuffle(a).slice(0, n);
const uniq = a => [...new Set(a)];
const fold = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd');
const today = () => Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 864e5);
const dayKey = (n = today()) => { const d = new Date(n * 864e5); return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0'); };

/* ---------- icons ---------- */
const IC = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
  lookup: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  practice: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>',
  review: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>',
  today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="17" rx="3"/><path d="M8 2.5v3M16 2.5v3M8 13l2.5 2.5L16 10"/></svg>',
  me: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  sound: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10-6.5a1 1 0 0 0 0-1.7l-10-6.6A1 1 0 0 0 8 5.5z"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
};

/* ---------- state (tiến độ) ---------- */
const STATE_KEY = 'englab-state-v1';
const DEFAULTS = {
  ver: 1, lessons: {}, srs: {}, errors: {}, fav: [], learnedV: {}, days: {}, lastLesson: '', sess: {}, qstat: {}, levelBest: {}, cpBest: {}, tasks: {}, lastBackup: 0, backupSnooze: 0,
  settings: { rate: 0.95, voice: '', seqLesson: true, seqLevel: true, showVi: true, showIpa: true, autoplay: true, theme: 'auto', goal: 30, newLimit: 15, lockTest: false, questSheet: true },
};
let S = load();
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STATE_KEY) || 'null');
    if (s && typeof s === 'object') return { ...structuredClone(DEFAULTS), ...s, settings: { ...DEFAULTS.settings, ...(s.settings || {}) } };
  } catch (e) { }
  return structuredClone(DEFAULTS);
}
function save() { try { localStorage.setItem(STATE_KEY, JSON.stringify(S)); } catch (e) { } }
function lessonState(id) { if (!S.lessons[id]) S.lessons[id] = { text: false, vocab: false, grammar: false, best: null, tries: 0 }; return S.lessons[id]; }
function bump(field, n = 1) { const k = dayKey(); const fresh = !S.days[k] && (field === 'a' || field === 'cards'), before = todayCount(); S.days[k] = S.days[k] || { a: 0, ok: 0, cards: 0, fresh: 0 }; S.days[k][field] = (S.days[k][field] || 0) + n;
  if (fresh) setTimeout(() => { try { cheerNewDay(); } catch (e) { } }, 1200);
  if ((field === 'a' || field === 'cards') && before < S.settings.goal && todayCount() >= S.settings.goal) setTimeout(() => { try { cheerShow('goal'); } catch (e) { } }, 900);
  try { questCheck(); } catch (e) { } }
function todayCount() { const d = S.days[dayKey()]; return d ? (d.a || 0) + (d.cards || 0) : 0; }
function streak() { let n = 0, t = today(); if (!S.days[dayKey(t)]) t--; while (S.days[dayKey(t)]) { n++; t--; } return n; }

/* ---------- IndexedDB cho dữ liệu Excel ---------- */
const IDB = {
  db: null,
  open() {
    return new Promise((res) => {
      try {
        const r = indexedDB.open('englab', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => { this.db = r.result; res(true); };
        r.onerror = () => res(false);
      } catch (e) { res(false); }
    });
  },
  get(k) {
    return new Promise(res => {
      if (!this.db) return res(null);
      try { const q = this.db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result ?? null); q.onerror = () => res(null); } catch (e) { res(null); }
    });
  },
  set(k, v) {
    return new Promise(res => {
      if (!this.db) return res(false);
      try { const t = this.db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(true); t.onerror = () => res(false); } catch (e) { res(false); }
    });
  },
};

/* ---------- dữ liệu ---------- */
let DATA = null;
const NEED = { DanhMucBai: ['Mã bài', 'Cấp', 'Chủ đề'], TuVung: ['Mã', 'Từ', 'Nghĩa tiếng Việt', 'Bài học'], CumTu: ['Mã', 'Cụm từ', 'Nghĩa', 'Bài học'], NguPhap: ['Mã', 'Điểm ngữ pháp', 'Bài học'], BaiKhoa: ['Mã câu', 'Bài học', 'Câu tiếng Anh', 'Nghĩa tiếng Việt'] };

function sheetToObjects(rows) {
  if (!rows || !rows.length) return [];
  const head = (rows[0] || []).map(h => String(h ?? '').trim());
  const out = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i]; if (!r || !r.some(v => v !== null && v !== undefined && v !== '')) continue;
    const o = {}; head.forEach((h, j) => { if (h) o[h] = r[j] === null || r[j] === undefined ? '' : String(r[j]); });
    out.push(o);
  }
  return out;
}
function datasetFromSheets(sheets, fileName) {
  const miss = [];
  for (const [sh, cols] of Object.entries(NEED)) {
    if (!sheets[sh]) { miss.push('thiếu sheet ' + sh); continue; }
    const head = (sheets[sh][0] || []).map(h => String(h ?? '').trim());
    cols.forEach(c => { if (!head.includes(c)) miss.push(sh + ' thiếu cột "' + c + '"'); });
  }
  if (miss.length) throw new Error('File Excel không đúng mẫu: ' + miss.slice(0, 4).join('; '));
  const pickS = n => sheets[n] ? sheets[n] : [];
  return { fileName, importedAt: new Date().toISOString(), sheets: { DanhMucBai: pickS('DanhMucBai'), TuVung: pickS('TuVung'), CumTu: pickS('CumTu'), NguPhap: pickS('NguPhap'), BaiKhoa: pickS('BaiKhoa'), NhanVat: pickS('NhanVat') } };
}
function buildData(ds) {
  const sh = ds.sheets;
  const lessons = sheetToObjects(sh.DanhMucBai).filter(l => l['Mã bài']);
  const vocab = sheetToObjects(sh.TuVung), phrases = sheetToObjects(sh.CumTu), grammar = sheetToObjects(sh.NguPhap), lines = sheetToObjects(sh.BaiKhoa), chars = sheetToObjects(sh.NhanVat);
  const by = {}; lessons.forEach(l => by[l['Mã bài']] = { v: [], p: [], g: [], s: [] });
  const put = (arr, k) => arr.forEach(x => { const id = x['Bài học']; if (by[id]) by[id][k].push(x); });
  put(vocab, 'v'); put(phrases, 'p'); put(grammar, 'g'); put(lines, 's');
  Object.values(by).forEach(b => b.s.sort((a, c) => (+a['STT'] || 0) - (+c['STT'] || 0)));
  const code = {}; vocab.forEach(x => code[x['Mã']] = { t: 'v', x }); phrases.forEach(x => code[x['Mã']] = { t: 'p', x }); grammar.forEach(x => code[x['Mã']] = { t: 'g', x });
  const gender = {};
  chars.forEach(c => { const v = c['Giọng gợi ý cho TTS'] || ''; gender[c['Tên trong bài']] = /^\s*nữ/i.test(v) ? 'F' : /^\s*nam hoặc/i.test(v) ? 'F' : 'M'; });
  const order = {}; lessons.forEach((l, i) => order[l['Mã bài']] = i);
  DATA = { ds, lessons, vocab, phrases, grammar, lines, chars, by, code, gender, order };
}
const L = id => DATA.lessons[DATA.order[id]];
const levelOf = id => (L(id) || {})['Cấp'] || String(id).slice(0, 2);
function lessonItems(id) {
  // bài ôn: lấy mục liên kết từ câu bài khóa
  const b = DATA.by[id] || { v: [], p: [], g: [], s: [] };
  if (b.v.length || b.p.length || b.g.length) return b;
  const v = [], p = [], g = [];
  b.s.forEach(s => String(s['Mã liên kết'] || '').split(/[;,]\s*/).forEach(c => { const e = DATA.code[c.trim()]; if (!e) return; (e.t === 'v' ? v : e.t === 'p' ? p : g).push(e.x); }));
  const u = a => [...new Map(a.map(x => [x['Mã'], x])).values()];
  return { v: u(v), p: u(p), g: u(g), s: b.s, linked: true };
}
function lessonDone(id) { const s = S.lessons[id]; return !!(s && s.best !== null && s.best >= PASS); }
function currentLessonId() {
  const first = DATA.lessons.find(l => !lessonDone(l['Mã bài']) && l['Loại bài'] !== 'Từ nền') || DATA.lessons[DATA.lessons.length - 1];
  return S.lastLesson && DATA.order[S.lastLesson] !== undefined && !lessonDone(S.lastLesson) && lessonUnlocked(S.lastLesson) ? S.lastLesson : first['Mã bài'];
}
/* ---------- học tuần tự (v3.3): khóa bài / khóa cấp ---------- */
const isBase = l => l && l['Loại bài'] === 'Từ nền';
function levelLessons(lv) { return DATA.lessons.filter(x => x['Cấp'] === lv && !isBase(x)); }
function levelPassed(lv) { return (S.levelBest[lv] || 0) >= PASS; }
function levelUnlocked(lv) { if (!S.settings.seqLevel) return true; const i = LEVELS.indexOf(lv); return i <= 0 || levelPassed(LEVELS[i - 1]); }
function levelReady(lv) { return !S.settings.seqLesson || (levelLessons(lv).every(x => lessonDone(x['Mã bài'])) && checkpoints(lv).every(cpPassed)); }
/* ---------- kiểm tra chặng (v4): nhóm 3–5 bài theo lượng kiến thức ---------- */
const CP_W = 70;
function lessonWeight(id) { const it = lessonItems(id); return it.v.length + it.p.length + 2 * it.g.length; }
function checkpoints(lv) {
  DATA._cp = DATA._cp || {}; if (DATA._cp[lv]) return DATA._cp[lv];
  const out = []; let g = [], sum = 0;
  const close = () => { if (g.length >= 2) out.push({ id: 'cp:' + lv + ':' + (out.length + 1), lv, n: out.length + 1, ids: g.slice() }); else if (g.length && out.length) out[out.length - 1].ids.push(...g); g = []; sum = 0; };
  for (const l of levelLessons(lv)) {
    if (l['Loại bài'] === 'Ôn tập') { close(); continue; }
    g.push(l['Mã bài']); sum += lessonWeight(l['Mã bài']);
    if ((g.length >= 3 && sum >= CP_W) || (g.length >= 4 && sum >= CP_W * .6) || g.length >= 5) close();
  }
  close();
  return (DATA._cp[lv] = out);
}
function cpAfter(id) { const l = DATA.lessons[DATA.order[id]]; if (!l) return null; return checkpoints(l['Cấp']).find(c => c.ids[c.ids.length - 1] === id) || null; }
function cpById(cid) { const lv = cid.split(':')[1]; return checkpoints(lv).find(c => c.id === cid); }

function forms(w) {
  w = String(w).toLowerCase().trim();
  const f = new Set([w]);
  if (/\s/.test(w)) return [...f];
  const add = s => f.add(s);
  add(w + 's'); add(w + 'es'); add(w + 'ed'); add(w + 'd'); add(w + 'ing'); add(w + 'er'); add(w + 'est'); add(w + 'ly');
  if (/y$/.test(w)) { const b = w.slice(0, -1); add(b + 'ies'); add(b + 'ied'); add(b + 'ier'); add(b + 'iest'); add(b + 'ily'); }
  if (/e$/.test(w)) { const b = w.slice(0, -1); add(b + 'ing'); add(b + 'er'); add(b + 'est'); }
  if (/[^aeiou][aeiou][bdgklmnprt]$/.test(w)) { const c = w + w.slice(-1); add(c + 'ed'); add(c + 'ing'); add(c + 'er'); add(c + 'est'); }
  if (/f$/.test(w)) add(w.slice(0, -1) + 'ves'); if (/fe$/.test(w)) add(w.slice(0, -2) + 'ves');
  if (IRR[w]) IRR[w].split(' ').forEach(add);
  return [...f];
}
function headword(v) { return String(v['Từ'] || '').replace(/\s*\(.*?\)\s*/g, ' ').split(/[,/]/)[0].trim(); }
function findForm(text, word) {
  const fs = forms(word).sort((a, b) => b.length - a.length).map(x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if (!fs.length || !fs[0]) return null;
  const re = new RegExp('(^|[^A-Za-z])(' + fs.join('|') + ')(?![A-Za-z])', 'i');
  const m = re.exec(text);
  if (!m) return null;
  return { start: m.index + m[1].length, end: m.index + m[1].length + m[2].length, text: m[2] };
}
function highlight(text, items) {
  const marks = [];
  items.forEach(v => {
    const w = headword(v); if (!w || w.length < 2) return;
    const m = findForm(text, w);
    if (m && !marks.some(x => m.start < x.end && x.start < m.end)) marks.push({ ...m, code: v['Mã'] });
  });
  marks.sort((a, b) => a.start - b.start);
  let out = '', i = 0;
  marks.forEach(m => { out += esc(text.slice(i, m.start)) + `<button class="hl" onclick="event.stopPropagation();openItem('${m.code}')">${esc(m.text)}</button>`; i = m.end; });
  return out + esc(text.slice(i));
}

const TTS = {
  voices: [], ok: 'speechSynthesis' in window, cur: null, token: 0,
  load() { if (!this.ok) return; const all = speechSynthesis.getVoices(); this.voices = all.filter(v => /^en[-_]/i.test(v.lang) || /^en$/i.test(v.lang)); },
  us() { return this.voices.filter(v => /en[-_]US/i.test(v.lang)); },
  natural(v) { const n = v.name + ' ' + (v.voiceURI || ''); let sc = 0; if (/natural|neural|online|premium|enhanced|wavenet|network|siri/i.test(n)) sc += 3; if (!v.localService) sc += 1; if (/en[-_]US/i.test(v.lang)) sc += 1; if (/compact|espeak|robot/i.test(n)) sc -= 2; return sc; },
  isNatural(v) { return this.natural(v) >= 4; },
  best() {
    const pref = S.settings.voice; let v = pref && this.voices.find(x => x.name === pref); if (v) return v;
    const pool = this.us().length ? this.us() : this.voices;
    return pool.slice().sort((a, b) => this.natural(b) - this.natural(a))[0] || null;
  },
  speak(text, opt = {}) {
    if (!this.ok) { toast('Trình duyệt này không có giọng đọc.'); return; }
    speechSynthesis.cancel();
    const t = ++this.token;
    const u = new SpeechSynthesisUtterance(String(text).replace(/\s*\/\s*/g, ', '));
    const v = this.best();
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
    u.rate = (opt.rate || S.settings.rate) * (opt.slow ? 0.7 : 1);
    u.onend = () => { if (t === this.token && opt.onend) opt.onend(); };
    u.onerror = () => { if (t === this.token && opt.onend) opt.onend(); };
    speechSynthesis.speak(u);
  },
  stop() { this.token++; if (this.ok) speechSynthesis.cancel(); },

/* ---------- nền bản đồ: hồ, ao, đầm sen chuyển động rải rác; tự né nút bài, thẻ, đường đi và hình trang trí ---------- */
function mapScape(W, H) {
  const mp = document.querySelector('.map'), obs = [];
  const rnd = (() => { let a = ((H * 2654435761) >>> 0) || 1; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; })();
  const R = (a, b) => a + rnd() * (b - a);
  if (mp) {
    const mr = mp.getBoundingClientRect();
    [...mp.children].forEach(el => {
      if (el.classList.contains('mscape')) return;
      if (el.classList.contains('mpath')) { const pe = el.querySelector('path'); if (pe && pe.getTotalLength) { const Ln = pe.getTotalLength(); for (let t = 0; t <= Ln; t += 12) { const q = pe.getPointAtLength(t); obs.push({ cx: q.x * W / 100, cy: q.y, r: 34 }); } } return; }
      const b = el.getBoundingClientRect(); if (b.width < 2 || b.height < 2 || (b.width > W * .95 && b.height > 320)) return;
      obs.push({ x1: b.left - mr.left - 8, y1: b.top - mr.top - 8, x2: b.right - mr.left + 8, y2: b.bottom - mr.top + 8 });
    });
  }
  const hit = (p, o) => {
    if (o.r) return ((o.cx - p.x) / (p.rx + o.r)) ** 2 + ((o.cy - p.y) / (p.ry + o.r)) ** 2 < 1;
    const qx = Math.max(o.x1, Math.min(p.x, o.x2)), qy = Math.max(o.y1, Math.min(p.y, o.y2));
    return ((qx - p.x) / (p.rx + 7)) ** 2 + ((qy - p.y) / (p.ry + 7)) ** 2 < 1;
  };
  const ponds = [], want = Math.max(4, Math.round(H / 105));
  for (let n = 0; n < want; n++) {
    for (let tr = 0; tr < 90; tr++) {
      const side = (n + (tr > 45 ? 1 : 0)) % 2, rx = R(24, 50), ry = rx * R(.52, .68), lo = side ? W / 2 : rx + 8, hi = side ? W - rx - 8 : W / 2, p = { x: R(lo, Math.max(lo + 1, hi)), y: R(ry + 8, H - ry - 8), rx, ry };
      if (obs.some(o => hit(p, o))) continue;
      if (ponds.some(q => ((q.x - p.x) / (q.rx + p.rx + 12)) ** 2 + ((q.y - p.y) / (q.ry + p.ry + 12)) ** 2 < 1)) continue;
      ponds.push(p); break;
    }
  }
  const inner = svgEl => svgEl.replace(/^<svg[^>]*>|<\/svg>$/g, '');
  const sw = (mk, w, h, sc) => `<g transform="scale(${sc}) translate(${-w / 2} ${-h / 2})">${inner(mk)}</g>`;
  const anim = (type, vals, dur, bg = 0) => `<animateTransform attributeName="transform" type="${type}" values="${vals}" dur="${dur}s" begin="-${bg.toFixed(1)}s" repeatCount="indefinite"/>`;
  const pad = (x, y, sc = 1) => `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${sc})"><g>${anim('translate', '0 0;3 1.4;0 0;-3 -1;0 0', R(7, 11), R(0, 8))}<ellipse rx="9" ry="4.4" fill="#6FCB8A"/><ellipse rx="6" ry="2.6" cy="-.4" fill="#8ED89C"/><path d="M0 0L9.5 -1.8" stroke="#B6E4F8" stroke-width="1.7"/></g></g>`;

function decorate() {
  const v = $('#view'), pg = v.dataset.page;
  const band = v.querySelector('.band');
  if (band && !band.querySelector('.scene')) {
    const home = band.classList.contains('home');
    band.insertAdjacentHTML('afterbegin', sceneSVG(!home) + (home ? `<svg class="sunh" width="62" height="62" viewBox="-32 -32 64 64" aria-hidden="true"><g class="sunrot">${sunFace()}</g></svg>` : ''));
    band.insertAdjacentHTML('beforeend', (PAGE_CRITTER[pg] || (() => ''))());
  }
  const mp = v.querySelector('.map');
  if (mp && !mp.querySelector('.mscape')) mp.insertAdjacentHTML('afterbegin', mapScape(mp.clientWidth || 360, mp.clientHeight || 600));
  /* hình "ngồi" trên mép trên của thẻ (chừa chỗ riêng, không đè chữ trong thẻ) */
  const put = (el, html, where = 'afterbegin') => { if (el && !el.querySelector(':scope > .dc')) { el.insertAdjacentHTML(where, html); if (/corner|peek/.test(html)) el.classList.add('hasdc'); } };
  if (pg === 'import') put(v.querySelector('.drop'), DECO.cat('', 66, 'peek'));
  if (pg === 'lesson' && lessonTab === 'vocab') { const c = v.querySelector('.page > .row.between > .muted'); if (c && !c.querySelector('.dc')) c.insertAdjacentHTML('beforeend', ' ' + DECO.bee(22, 'tag fly')); }
  if (pg === 'lesson' && lessonTab === 'grammar') { const c = v.querySelector('.page > .muted.small'); if (c && !c.querySelector('.dc')) c.insertAdjacentHTML('beforeend', ' ' + DECO.sprig(18, 'tag')); }
  if (pg === 'lesson' && lessonTab === 'text') { const c = v.querySelector('.page > .lead'); if (c && !c.querySelector('.dc')) c.insertAdjacentHTML('beforeend', ' ' + DECO.ladybug(18, 'tag')); }
  if (pg === 'practice') { const c = v.querySelector('.page > .card'); put(c, DECO.mushroom(24, 'corner')); }
  if (pg === 'review') put(v.querySelector('.page > .card'), DECO.snail(34, 'corner'));
  if (pg === 'quiz' || pg === 'srs') { if (!v.querySelector('.meadow')) v.insertAdjacentHTML('beforeend', meadow()); }
  if (pg === 'srs') put(v.querySelector('.qcard'), DECO.hedgehog(40, 'corner'));

}

  const x = bx(p), y = by(p);

    <path d="M16 70 Q180 -10 344 70" fill="none" stroke="#3A4C7A" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>

/* ---------- lookup ---------- */
function lookupPage() {
  const q = fold(lookQ.trim());
  const src = lookTab === 'v' ? DATA.vocab : lookTab === 'p' ? DATA.phrases : lookTab === 'f' ? DATA.vocab.filter(v => S.fav.includes(v['Mã'])) : DATA.grammar;
  let list = src;
  if (lookLv) list = list.filter(x => (x['Cấp'] || levelOf(x['Bài học'])) === lookLv);
  if (q) {
    const key = x => lookTab === 'g' ? fold(x['Điểm ngữ pháp'] + ' ' + x['Công thức'] + ' ' + x['Giải thích ngắn']) : lookTab === 'p' ? fold(x['Cụm từ'] + ' ' + x['Nghĩa']) : fold(x['Từ'] + ' ' + x['Nghĩa tiếng Việt']);
    const head = x => fold(lookTab === 'g' ? x['Điểm ngữ pháp'] : lookTab === 'p' ? x['Cụm từ'] : x['Từ']);
    list = list.filter(x => key(x).includes(q));
    list.sort((a, b) => (head(b).startsWith(q) ? 1 : 0) - (head(a).startsWith(q) ? 1 : 0) || (head(a) === q ? -1 : 0) - (head(b) === q ? -1 : 0));
  }
  const shown = list.slice(0, lookN);
  const card = x => lookTab === 'g' ? grammarCard(x, false) : lookTab === 'p' ? phraseCard(x, false) : vocabCard(x, false);
  return `<div class="band compact"><h1>Tra cứu</h1><div class="sub">${DATA.vocab.length} từ · ${DATA.phrases.length} cụm · ${DATA.grammar.length} điểm ngữ pháp</div></div>
  <div class="page"><div class="chips" style="margin-bottom:10px">${[['v', 'Từ vựng'], ['p', 'Cụm từ'], ['g', 'Ngữ pháp'], ['f', '★ Đánh dấu']].map(([k, t]) => `<button class="chip ${lookTab === k ? 'on' : ''}" onclick="lookTab='${k}';lookN=40;render()">${t}</button>`).join('')}</div>
  <input id="lq" class="search" type="search" placeholder="Tìm tiếng Anh hoặc nghĩa tiếng Việt (không dấu cũng được)…" value="${esc(lookQ)}" oninput="lookQ=this.value;lookN=40;clearTimeout(window._t);window._t=setTimeout(()=>{render();const i=$('#lq');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)">
  <div class="chips" style="margin-bottom:12px"><button class="chip ${!lookLv ? 'on' : ''}" onclick="lookLv='';render()">Mọi cấp</button>${LEVELS.map(lv => `<button class="chip ${lookLv === lv ? 'on' : ''}" onclick="lookLv='${lv}';render()">${lv}</button>`).join('')}</div>
  <div class="muted small" style="margin-bottom:8px">${list.length} kết quả</div>
  ${shown.map(x => `<div onclick="openItem('${x['Mã']}')" style="cursor:pointer">${card(x)}</div>`).join('') || '<div class="empty">Không có kết quả.</div>'}
  ${list.length > lookN ? `<button class="btn ghost block" onclick="lookN+=60;render()">Xem thêm (${list.length - lookN})</button>` : ''}</div>`;
}

}

/* ===== English Lab · khóa truy cập (v6.0) =====
   Mã truy cập + gắn máy, kiểm tra với Cloudflare Worker (xem 4_CLOUDFLARE_worker/).
   Địa chỉ máy chủ nằm trong file gate-config.js (window.ENGLAB_GATE = 'https://englab-access.xxx.workers.dev').
   Chỉ khóa khi chạy trên web (GitHub Pages). Mở file HTML trực tiếp trên máy (file://) thì không khóa. */
const GATE_KEY = 'englab-gate', DEV_KEY = 'englab-device';
const GATE_GRACE = 30 * 864e5;      // mất mạng: vẫn học được tối đa 30 ngày kể từ lần xác minh gần nhất
const GATE_RECHECK = 20 * 60e3;     // quay lại app sau 20 phút thì xác minh lại
let GATE = null, gateResolve = null, gateLast = 0, gateBusy = false, gateSending = false;
const gateCfg = () => String(window.ENGLAB_GATE || '').trim().replace(/\/+$/, '');

/* ---------- lưu trữ cục bộ ---------- */
function gateLoad() { try { const j = JSON.parse(localStorage.getItem(GATE_KEY) || 'null'); return j && j.role ? j : null; } catch (e) { return null; } }
function gateSave() { try { localStorage.setItem(GATE_KEY, JSON.stringify(GATE)); } catch (e) { } }
function gateDrop() { GATE = null; try { localStorage.removeItem(GATE_KEY); } catch (e) { } }
const DEV_RE = /^[A-Za-z0-9-]{16,64}$/;
async function devInit() {   // mã máy: giữ trong localStorage và bản sao trong IndexedDB (phòng một bên bị xóa)
  let d = ''; try { d = localStorage.getItem(DEV_KEY) || ''; } catch (e) { }
  if (!DEV_RE.test(d)) { try { d = (await IDB.get('device')) || ''; } catch (e) { d = ''; } }
  if (!DEV_RE.test(d)) d = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : [...crypto.getRandomValues(new Uint8Array(16))].map(x => x.toString(16).padStart(2, '0')).join('');
  try { localStorage.setItem(DEV_KEY, d); } catch (e) { }
  try { await IDB.set('device', d); } catch (e) { }
  window._dev = d;
}
const devId = () => window._dev || '';

async function gateApi(path, body, admin) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 12000);
  try {
    const r = await fetch(gateCfg() + path, { method: body === undefined ? 'GET' : 'POST', cache: 'no-store', signal: ctl.signal,
      headers: { 'Content-Type': 'application/json', ...(admin ? { Authorization: 'Bearer ' + admin } : {}) }, body: body === undefined ? undefined : JSON.stringify(body) });
    let j = {}; try { j = await r.json(); } catch (e) { }
    return { s: r.status, j };
  } catch (e) { return { s: 0, j: { error: 'network' } }; } finally { clearTimeout(t); }
}

/* ---------- khởi động ---------- */
function gateLoadCfg() {
  return new Promise(res => { const s = document.createElement('script'); s.src = 'gate-config.js'; s.onload = () => res(true); s.onerror = () => res(false); document.head.appendChild(s); });
}
async function gateStart() {
  if (!isWeb()) return;                                 // mở file trực tiếp: không khóa
  await gateLoadCfg(); await devInit();
  if (!gateCfg()) { gateScreen('nocfg'); return new Promise(() => { }); }
  GATE = gateLoad();
  if (!GATE) { gateScreen(); return new Promise(res => { gateResolve = res; }); }
  gateWatch(); gateVerify();                            // đã có mã: vào học luôn, kiểm tra ngầm
}
let gateWatching = false;
function gateWatch() {

  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && GATE && Date.now() - gateLast > GATE_RECHECK) gateVerify(); });
  window.addEventListener('online', () => { if (GATE) gateVerify(); });
}
async function gateVerify() {
  if (!GATE || gateBusy) return; gateBusy = true;
  const r = await gateApi('/check', { h: GATE.h || '', device: devId() }, GATE.admin);
  gateBusy = false;
  if (r.s === 200) { GATE.t = Date.now(); if (r.j.name) GATE.name = r.j.name; gateSave(); gateLast = Date.now(); return; }
  if (r.s === 403 || r.s === 409) { const why = r.s === 403 ? 'revoked' : 'device'; gateDrop(); gateScreen(why); return; }
  if (Date.now() - (GATE.t || 0) > GATE_GRACE) gateScreen('offline');   // lỗi mạng/máy chủ: cho dùng tiếp trong hạn
}
async function gateAdminLogin(raw) {   // kiểm tra mã quản trị bằng /admin/list (không gắn máy, không ảnh hưởng mã nào)
  const r = await gateApi('/admin/list', undefined, raw);
  if (r.s === 200) { GATE = { role: 'admin', h: '', name: 'Quản trị', admin: raw, t: Date.now() }; gateSave(); gateLast = Date.now(); return { ok: true, admin: true }; }

}
async function gateClaim(raw) {
  const r = await gateApi('/claim', { code: raw, device: devId() });
  if (r.s === 200 && r.j.ok) { GATE = { role: r.j.role, h: r.j.h || '', name: r.j.name || '', admin: r.j.role === 'admin' ? raw : '', t: Date.now() }; gateSave(); gateLast = Date.now(); return { ok: true, admin: r.j.role === 'admin' }; }
  return { err: (r.j && r.j.error) || 'server' };
}

/* ---------- màn nhập mã ---------- */

  offline: ['Cần kết nối mạng', 'Đã lâu app chưa xác minh được với máy chủ. Hãy bật mạng rồi bấm “Thử lại”.'],

let gateTab = 'user';
function gateSetTab(t) { gateTab = t; gateScreen(gateMode, ''); }
let gateMode = '';

    <form onsubmit="gateSubmit(event)" autocomplete="off"><input id="gcode" class="gin" placeholder="${adm ? 'MÃ QUẢN TRỊ' : 'ABCDE-FGHJK'}" maxlength="40" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" inputmode="text" aria-label="${adm ? 'Mã quản trị' : 'Mã truy cập'}" oninput="gateFmt(this)">

    ${ios && !adm ? `<div class="gtip">📱 iPhone/iPad: hãy bấm <b>Chia sẻ → Thêm vào MH chính</b> trước, rồi mở app từ biểu tượng và nhập mã ở đó. App đã cài và trang Safari là hai nơi lưu riêng, nhập ở Safari rồi chuyển sang app sẽ bị báo “mã đã dùng trên máy khác”.</div>` : ''}

function gateFmt(i) {   // chỉ giữ chữ + số; mã người dùng (10 ký tự) tự thêm gạch giữa, mã quản trị dài hơn thì để nguyên

async function gateSubmit(e) {

  if (raw.replace(/[^A-Za-z0-9]/g, '').length < 4) { m.textContent = 'Hãy nhập mã truy cập.'; return; }

}
async function gateRetry() {

  const r = await gateApi('/check', { h: GATE.h || '', device: devId() }, GATE.admin);
  if (r.s === 200) { GATE.t = Date.now(); gateSave(); gateLast = Date.now(); gateOpen(); return; }

}
function gateOpen(openAdmin) {
  const el = document.getElementById('gate'); if (el) el.remove();
  gateWatch();
  if (gateResolve) { const r = gateResolve; gateResolve = null; r(); } else { try { render(); } catch (e) { } }
  if (openAdmin) {   // lần đầu vào bằng mã quản trị: mở bảng quản trị sau khi app nạp xong (và sau bảng nhiệm vụ)
    let n = 0; const iv = setInterval(() => { if ((typeof DATA !== 'undefined' && DATA) || ++n > 40) { clearInterval(iv); setTimeout(() => { try { admOpen(); } catch (e) { } }, 2200); } }, 250);
  }
}

/* ---------- thẻ trong tab Tôi + trang quản trị ---------- */
const isAdmin = () => !!(GATE && GATE.role === 'admin');
function gateCard() {
