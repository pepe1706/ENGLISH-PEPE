html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:84px}
.hidden{display:none!important}

/* ---------- top band ---------- */
.band{background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%);color:#F3F5FA;padding:18px 18px 22px;position:relative;overflow:hidden}
.band h1{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.15;margin:0;letter-spacing:-.01em}
.band .sub{color:#B9C3DC;font-size:13px;margin-top:4px}
.band .back{background:rgba(255,255,255,.1);border:0;border-radius:10px;padding:6px 11px;color:#fff;font-size:13px;margin-bottom:10px}
.band.compact{padding:14px 18px 16px}
.band.compact h1{font-size:21px}
.route{margin:14px -4px 0;display:block;width:calc(100% + 8px);height:auto}
.route-labels{display:flex;justify-content:space-between;font-size:11px;color:#9FB0D6;letter-spacing:.08em;margin-top:-2px}
.route-labels b{color:#fff;font-weight:700}

/* ---------- layout ---------- */
.page{padding:14px 16px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px;box-shadow:var(--shadow)}
.section-title{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin:0 0 8px}
.h2{font-family:var(--serif);font-size:19px;font-weight:600;margin:0 0 4px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:11.5px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt{margin-top:10px}.mb0{margin-bottom:0}
.empty{text-align:center;color:var(--muted);padding:30px 10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:12px;background:var(--btn);color:#fff;padding:11px 16px;font-weight:700;min-height:44px}
.btn svg{width:18px;height:18px;flex:none}
.btn.amber{background:var(--amber);color:#1B1300}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.soft{background:var(--blue-soft);color:var(--blue)}
.btn.danger{background:var(--coral-soft);color:var(--coral)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;min-height:34px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.lv{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px;color:#fff;letter-spacing:.04em}
.lv.A1{background:var(--a1)}.lv.A2{background:var(--a2)}.lv.B1{background:var(--b1)}.lv.B2{background:var(--b2)}
.badge{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--blue-soft);color:var(--blue)}
.badge.ok{background:var(--green-soft);color:var(--green)}
.badge.warn{background:var(--amber-soft);color:#9A5B00}
.search{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:11px 13px;margin:0 0 10px;outline:none}
.search:focus{border-color:var(--blue)}
select.sel{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;max-width:100%}
.progress{height:7px;background:var(--line);border-radius:9px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--amber);border-radius:9px}

/* ---------- bottom nav ---------- */
.nav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,560px);display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:5px 0;min-height:52px}
.nav button svg{width:23px;height:23px}
.nav button.on{color:var(--ink)}
.nav button.on svg{color:var(--amber)}
.nav .dot{position:absolute;margin-left:18px;margin-top:-2px;background:var(--coral);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;line-height:16px}

/* ---------- home ---------- */
.continue{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.continue .code{font-family:var(--mono);font-size:12px;color:var(--muted)}
.continue .ttl{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.25;margin:2px 0}
.goal{display:flex;gap:14px;align-items:center}
.ring{width:66px;height:66px;flex:none;border:0;background:none;padding:0;position:relative}
.ring svg{width:66px;height:66px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats3 b{display:block;font-size:20px;font-family:var(--serif)}
.stats3 span{font-size:11.5px;color:var(--muted)}
.level-group{margin:0 0 10px}
.level-group>summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.level-group>summary::-webkit-details-marker{display:none}
.level-group[open]>summary{border-bottom-left-radius:0;border-bottom-right-radius:0}
.level-group .lrows{border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;background:var(--card);overflow:hidden}
.lrow{display:grid;grid-template-columns:54px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 12px}
.lrow:first-child{border-top:0}
.lrow .c{font-family:var(--mono);font-size:12px;color:var(--muted)}
.lrow .t{font-weight:600;font-size:14px;line-height:1.3}
.lrow .s{font-size:12px;color:var(--muted)}
.lrow.cur{background:var(--amber-soft)}
.mark{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;border:2px solid var(--line);color:var(--muted)}
.mark.done{background:var(--green);border-color:var(--green);color:#fff}
.mark.part{border-color:var(--amber);color:#9A5B00}

/* ---------- lesson ---------- */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.tabs button{background:none;border:0;padding:12px 2px 10px;font-weight:700;font-size:13.5px;color:var(--muted);border-bottom:3px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--amber)}
.tabs button .ck{color:var(--green);font-size:12px;margin-left:3px}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.line{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:11px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;cursor:pointer}
.line.playing{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;background:#7A859F}
.line .who{font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:1px}
.line .en{font-size:16px;line-height:1.45}
.line .vi{font-size:13.5px;color:var(--ink2);margin-top:3px}
.line .en.masked{filter:blur(6px);user-select:none}
.line.reveal .en.masked{filter:none}
.hl{background:none;border:0;padding:0;font:inherit;color:inherit;border-bottom:2px solid var(--amber);cursor:pointer}
.lead{font-size:13.5px;color:var(--ink2)}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin:0 0 10px}
.vtop{display:flex;align-items:flex-start;gap:10px}
.vword{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.15}
.ipa{font-family:var(--mono);font-size:13px;color:var(--blue)}
.pos{font-size:12px;color:var(--muted);font-style:italic}
.vmean{font-size:15px;margin:4px 0 2px}
.ex{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;margin-top:8px}
.ex .e{font-size:14.5px}.ex .v{font-size:13px;color:var(--muted)}
.note{font-size:13px;border-left:3px solid var(--amber);background:var(--amber-soft);padding:7px 10px;border-radius:0 9px 9px 0;margin-top:8px}
.note.err{border-left-color:var(--coral);background:var(--coral-soft)}
.note.us{border-left-color:var(--blue);background:var(--blue-soft)}
.kv{font-size:13px;margin-top:6px}.kv b{color:var(--muted);font-weight:700}
.snd{flex:none;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.snd svg{width:17px;height:17px}
.snd.mini{width:28px;height:28px}.snd.mini svg{width:14px;height:14px}
.star{border:0;background:none;font-size:20px;color:var(--line);padding:2px 4px}
.star.on{color:var(--amber)}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:0 0 10px;overflow:hidden}
.gcard>summary{list-style:none;padding:13px 14px;cursor:pointer}
.gcard>summary::-webkit-details-marker{display:none}
.gcard[open]>summary{border-bottom:1px solid var(--line)}
.gname{font-weight:700;font-size:15px;line-height:1.35}
.gbody{padding:12px 14px}
.formula{font-family:var(--mono);font-size:13px;background:var(--blue-soft);color:var(--ink);border-radius:9px;padding:8px 10px;white-space:pre-wrap}
.stepbar{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--green-soft);border-radius:12px;padding:10px 12px;margin:6px 0 12px;font-size:13.5px}

/* ---------- practice ---------- */
.ptype{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin:0 0 8px}
.ptype .ic{width:40px;height:40px;border-radius:11px;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.ptype .ic.amber{background:var(--amber-soft);color:#9A5B00}.ptype .ic.coral{background:var(--coral-soft);color:var(--coral)}.ptype .ic.green{background:var(--green-soft);color:var(--green)}
.ptype b{display:block;font-size:14.5px}.ptype span{font-size:12.5px;color:var(--muted)}

/* ---------- quiz ---------- */
.qtop{display:flex;align-items:center;gap:10px;padding:12px 16px;position:sticky;top:0;background:var(--bg);z-index:10}
.qtop .bar{flex:1;height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.qtop .bar i{display:block;height:100%;background:var(--amber)}
.qtop .back{border:0;background:var(--card);border-radius:10px;padding:7px 11px;font-weight:700;font-size:13px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 16px;margin:4px 16px 14px;text-align:center;box-shadow:var(--shadow)}
.qkind{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.qprompt{font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.25;margin:10px 0 6px}
.qprompt.long{font-size:19px;font-family:var(--sans);font-weight:600}
.qsub{color:var(--muted);font-size:14px}
.opts{display:grid;gap:9px;padding:0 16px}
.opt{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:15px;min-height:50px}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--coral);background:var(--coral-soft)}
.opt:disabled{cursor:default;color:var(--ink)}
.play{width:66px;height:66px;border-radius:50%;border:0;background:var(--btn);color:#fff;display:inline-flex;align-items:center;justify-content:center;margin:6px 4px}
.play svg{width:28px;height:28px}
.play.slow{width:48px;height:48px;background:var(--blue-soft);color:var(--blue);font-size:11px;font-weight:800}
.tiles{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;padding:0 16px;margin:0 0 12px}
.tile{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 11px;font-size:15px;min-height:42px}
.tile.used{opacity:.25}
.answer-zone{min-height:62px;margin:0 16px 12px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start}
.answer-zone .tile{background:var(--blue-soft);border-color:transparent}
.typebox{display:block;width:calc(100% - 32px);margin:0 16px 12px;border:1.5px solid var(--line);border-radius:14px;padding:12px;min-height:86px;background:var(--card);resize:vertical}
.feedback{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,560px);padding:14px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
.feedback.good{background:var(--green-soft)}.feedback.bad{background:var(--coral-soft)}
.feedback .fh{font-weight:800;font-size:16px}
.feedback.good .fh{color:var(--green)}.feedback.bad .fh{color:var(--coral)}
.feedback .fx{font-size:13.5px;margin:4px 0 10px;color:var(--ink2)}
.diff .ok{color:var(--green);font-weight:700}.diff .no{color:var(--coral);text-decoration:line-through}.diff .miss{color:#9A5B00;font-weight:700}
.srs-face{min-height:200px;display:flex;flex-direction:column;justify-content:center}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:0 16px}
.grades button{border:0;border-radius:12px;padding:10px 4px;font-weight:800;font-size:13.5px;min-height:56px;line-height:1.15}
.grades small{display:block;font-weight:600;font-size:11px;opacity:.8}
.g0{background:var(--coral-soft);color:var(--coral)}.g3{background:var(--amber-soft);color:#9A5B00}.g4{background:var(--green-soft);color:var(--green)}.g5{background:var(--blue-soft);color:var(--blue)}
.score{font-family:var(--serif);font-size:54px;font-weight:600;line-height:1}
.wrongitem{border-top:1px solid var(--line);padding:9px 0;font-size:13.5px}

/* ---------- me ---------- */
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.set:first-of-type{border-top:0}
.bars{display:flex;gap:6px;align-items:flex-end;height:70px;margin-top:6px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted)}
.bars i{display:block;width:100%;background:var(--amber);border-radius:5px 5px 2px 2px;min-height:2px}

/* ---------- modal & toast ---------- */
.modalbg{position:fixed;inset:0;z-index:40;background:rgba(10,16,32,.5);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg);width:min(100%,560px);max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.modal .x{border:0;background:var(--card);border-radius:10px;padding:6px 11px;font-weight:700}
.toast{position:fixed;z-index:50;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);max-width:90%}

/* ---------- import ---------- */
.import{padding:28px 18px}
.drop{border:2px dashed var(--line);border-radius:18px;background:var(--card);padding:28px 16px;text-align:center}
.drop input{display:none}
.drop .big{font-family:var(--serif);font-size:20px;font-weight:600;margin:8px 0 4px}
.err{color:var(--coral);font-weight:600}

#view[data-page="home"]{background:linear-gradient(#FFF9EF 0,#D8F0DA 160px,#C6E9CC 100%)}
.map{position:relative;margin:4px 0 0;overflow:hidden}
.mpath{position:absolute;left:0;top:0;width:100%;height:100%}
.nd{position:absolute;width:62px;height:56px;margin:-28px 0 0 -31px;border:0;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:19px;background:#EEF2F6;color:#8A96A8;box-shadow:0 6px 0 #C9D2DE;z-index:2;cursor:pointer;padding:0}

.nd.part{background:#E2F5E8;color:var(--pd);box-shadow:0 6px 0 #A9D9B8}

.nd.cur{background:var(--p);color:#fff;width:74px;height:66px;margin:-33px 0 0 -37px;font-size:24px;box-shadow:0 6px 0 var(--pd),0 0 0 7px rgba(255,255,255,.75);z-index:3}

.nd.done+.ncode{top:auto!important;display:none}
.glow{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:radial-gradient(rgba(255,255,255,.95),rgba(255,255,255,0) 68%);z-index:1;animation:pulse 2.4s ease-in-out infinite}

.mdeco{position:absolute;transform:translateX(-50%);display:flex;align-items:flex-end;gap:2px;z-index:1;pointer-events:none}
.chest{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;z-index:2;pointer-events:none}.chest span{font-size:11px;font-weight:900;background:#FFF0C7;color:#8A5A00;padding:1px 7px;border-radius:999px;box-shadow:0 2px 0 #E8CF96}
.chest.open span{background:#E2F5E8;color:var(--pd);box-shadow:0 2px 0 #A9D9B8}
.mend{position:absolute;left:50%;transform:translateX(-50%);background:#fff;color:var(--pd);font-weight:900;padding:6px 14px;border-radius:999px;box-shadow:0 3px 0 #A9D9B8;white-space:nowrap}
/* lessons list */

.level-group .lrows{border:1.5px solid var(--line);border-top:0}

.mark.done{background:var(--p);border-color:var(--p)}
/* lesson */
.tabs{background:var(--bg);border:0;padding:10px 12px 8px;gap:6px}

.tabs button.on{background:var(--p);color:#fff;box-shadow:0 3px 0 var(--pd)}
.tabs button .ck{color:inherit}
.toolbar .btn{min-height:40px}
.line{border:1.5px solid var(--line);border-radius:18px;box-shadow:0 2px 0 #F1E8D7}
.line.playing{border:2px solid var(--amber);background:#FFF8E6;box-shadow:0 2px 0 #F3D98F}

.lead{color:var(--ink2)}

.vh{display:flex;align-items:flex-start;gap:12px}.vn{width:30px;height:30px;border-radius:10px;background:#FFF0C7;color:#8A5A00;display:grid;place-items:center;font-weight:900;font-size:13px;flex:none;margin-top:4px}

.w2{display:flex;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap}.ipa{font-size:15px;font-weight:700;color:var(--pd);font-family:var(--sans)}
.sy{display:inline-flex;align-items:center;gap:3px}.sy i{width:8px;height:8px;border-radius:50%;background:var(--line)}.sy i.on{width:12px;height:12px;background:var(--coral)}.sy em{font-style:normal;font-size:12px;color:var(--muted);font-weight:700;margin-left:4px}
.vact{display:flex;flex-direction:column;align-items:center;gap:2px}
.snd{border:1.5px solid var(--line);background:var(--ps);color:var(--pd)}
.mean{margin:10px 0 2px;padding:10px 12px;border-radius:14px;background:#FFF0C7;font-size:17px;font-weight:800;color:#6B4300}

.kvg{display:grid;gap:6px;margin-top:10px}.kvr{display:grid;grid-template-columns:104px 1fr;gap:8px;align-items:start;padding:9px 11px;border-radius:12px;background:var(--ps)}
.kl{font-size:12.5px;font-weight:900;color:var(--pd)}.kd{font-size:14px;font-weight:700}

.gc>summary{list-style:none;cursor:pointer}.gc>summary::-webkit-details-marker{display:none}
.gh{display:flex;gap:8px;align-items:center}.gcode{font-size:12px;font-weight:900;background:#FFF0C7;color:#8A5A00;padding:3px 9px;border-radius:8px}.gcar{margin-left:auto;color:var(--muted);transition:transform .2s}.gc[open] .gcar{transform:rotate(180deg)}

.gbody{padding:4px 0 0}
.ftab{border:1.5px solid var(--line);border-radius:14px;overflow:hidden}.fr{display:grid;grid-template-columns:82px 1fr;gap:10px;align-items:center;padding:8px 10px;font-size:14px;font-weight:700}.fr.nl{grid-template-columns:1fr}.fr+.fr{border-top:1.5px solid var(--line)}

.src{font-size:11.5px;color:var(--muted);margin-top:10px}
.star{color:#E3D8C2}.star.on{color:#FFB938}
/* luyện tập */
.ptype{display:block;padding:12px 14px;border:1.5px solid var(--line);border-radius:20px;box-shadow:var(--shadow);margin:0 0 10px;background:#fff;text-align:left;width:100%}

.ptype .ic.a{background:#FFF0C7;color:#B07A00}.ptype .ic.b{background:#E3EFFF;color:#3A62C9}.ptype .ic.r{background:var(--coral-soft);color:#E0533A}
.pt{flex:1;display:flex;flex-direction:column;min-width:0}.pt b{font-size:15.5px;font-weight:900;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.pt>span{font-size:12.5px;color:var(--muted);font-weight:600}

.card.test{border-color:#F3D98F;background:linear-gradient(#FFFDF6,#fff)}.card.test.pass{border-color:#A9D9B8}

.qtop{display:flex;align-items:center;gap:10px;padding:12px 16px 6px;background:var(--bg)}

.qn{font-size:13px;color:var(--muted);font-weight:700}.qn b{color:var(--ink)}
.combo{background:#FFF0D6;color:var(--accd);font-weight:900;padding:4px 10px;border-radius:999px;font-size:13px;white-space:nowrap}
.lbtn{border:1.5px solid var(--line);background:#fff;color:var(--pd);border-radius:12px;padding:6px 10px;font-weight:900;font-size:13px;white-space:nowrap}
.strip{display:flex;gap:6px;padding:4px 16px 6px;overflow-x:auto;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--ink2);font-size:12.5px;font-weight:900;padding:0}

.say{display:flex;align-items:flex-end;gap:6px;padding:2px 16px 0}
.bub{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:7px 12px;font-weight:800;font-size:13.5px;box-shadow:0 2px 0 var(--line);margin-bottom:12px}
.qcard{border:1.5px solid var(--line);border-radius:24px;box-shadow:var(--shadow);margin:6px 16px 12px;position:relative}
.qkind{font-weight:900;color:var(--pd)}
.qprompt{font-family:var(--sans);font-weight:900}.qprompt.long{font-weight:800}
.qsub.ipa{color:var(--pd);font-weight:700}
.play{background:var(--p);box-shadow:0 4px 0 var(--pd)}.play.slow{background:var(--ps);color:var(--pd);box-shadow:0 3px 0 #BFE6CC}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:18px;font-weight:800;box-shadow:0 3px 0 #F1E8D7}
.opt i{font-style:normal;width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;background:var(--ps);color:var(--pd);font-size:12px;font-weight:900}
.opt.right{background:#E3F8EC;border-color:#3DBB74;box-shadow:0 3px 0 #2A9C5C}.opt.right i{background:#3DBB74;color:#fff}
.opt.wrong{background:var(--coral-soft);border-color:var(--coral);box-shadow:0 3px 0 #D9463A}.opt.wrong i{background:var(--coral);color:#fff}
.tile{border:2px solid var(--line);border-radius:12px;font-weight:800;box-shadow:0 3px 0 #F1E8D7}
.answer-zone{border:2px dashed #D9CBB0;background:#fff;border-radius:18px}
.answer-zone .tile{background:var(--ps);border-color:transparent;color:var(--pd);box-shadow:none}
.typebox{border:2px solid var(--line);border-radius:16px}
.qfoot{padding:12px 16px 0}
.feedback{border-radius:26px 26px 0 0;border-top:2px solid #BDEBCF;background:#E3F8EC;padding-top:16px}
.feedback.bad{background:#FFEDE8;border-top-color:#F6C5BA}
.feedback .fbm{position:absolute;right:18px;top:-34px}
.feedback .fh{font-size:21px;font-weight:900;display:flex;align-items:center;gap:8px}
.xp{background:#FFC21A;color:#5A3A00;font-size:12.5px;padding:2px 9px;border-radius:999px;box-shadow:0 2px 0 #E59A00}
.fbr{display:grid;grid-template-columns:1fr 1.2fr;gap:10px}
.meadow{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:18px 0 8px;opacity:.9}
/* danh sách câu & kết quả */
.qhead{display:flex;align-items:center;gap:12px;padding:14px 16px 4px}.qhead>div{flex:1;display:flex;flex-direction:column;line-height:1.25}.qhead b{font-size:19px;font-weight:900}.qhead span{font-size:13px;color:var(--muted);font-weight:700}

.card.sum{position:relative}
.qlist{padding:4px 14px}.qrow{display:flex;align-items:center;gap:12px;padding:9px 0;border:0;border-top:1.5px solid var(--line);background:none;width:100%;text-align:left}.qrow:first-child{border-top:0}
.qn2,.qrow .qn,.wr .qn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:900;flex:none;background:#F2EDE2;color:var(--ink2)}
.qrow.g .qn{background:#3DBB74;color:#fff}.qrow.r .qn,.qn.r{background:var(--coral);color:#fff}
.qt{flex:1;display:flex;flex-direction:column;line-height:1.3;min-width:0}.qt b{font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.qt span{font-size:12.5px;color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qs{font-weight:900;font-size:17px}.qrow.g .qs{color:#2A9C5C}.qrow.r .qs{color:var(--coral)}.qrow.o .qs{color:var(--muted)}
.rhead{position:relative;display:flex;align-items:center;gap:10px;padding:14px 16px 0;font-weight:800;color:var(--muted)}
.conf{position:absolute;left:0;right:0;top:56px;height:90px;pointer-events:none}.conf i{position:absolute;width:9px;height:14px;border-radius:3px;animation:fall 2.6s ease-in infinite}
.rs{text-align:center}.rst{display:flex;justify-content:center;margin-top:16px}.rst .stars svg:nth-child(2){transform:translateY(-10px) scale(1.12)}
.rh{font-size:30px;font-weight:900;color:var(--pd);margin:6px 0 0}.rp{color:var(--ink2);margin:2px 0 0}.okc{color:var(--pd)}

.tl3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.t{border-radius:16px;padding:8px;display:flex;flex-direction:column}.t b{font-size:20px;font-weight:900}.t span{font-size:12px;font-weight:800}

.rs .card{text-align:left}
/* ôn tập, me, import */
.grades button{border-radius:14px;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.bars i{background:var(--p)}
.modal{border-radius:24px 24px 0 0}
.toast{background:var(--pd);border-radius:14px;font-weight:700}
.drop{display:block;border:2px dashed #D9CBB0;border-radius:22px;position:relative;margin-top:30px;background:#fff}
.drop .big{font-family:var(--sans);font-weight:900}
.formula{font-family:var(--sans);background:var(--ps)}
.vword{font-family:var(--sans);font-weight:900}
.score{font-family:var(--sans);font-weight:900}
.stats3 b{font-family:var(--sans);font-weight:900}
.continue .ttl{font-family:var(--sans);font-weight:900}
.diff .ok{color:#2A9C5C}
/* trang trí */
.dc{pointer-events:none;flex:none}
.dc.peek{position:absolute;right:22px;top:-41px}
.dc.corner{position:absolute;right:12px;top:10px}
.dc.tag{vertical-align:middle;margin-left:4px}
.page>.card{position:relative;overflow:visible}
.emptyart{display:flex;justify-content:center;align-items:flex-end;gap:4px;margin-bottom:8px}
/* chuyển động nhẹ */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes fly{0%,100%{transform:translate(0,0) rotate(-4deg)}50%{transform:translate(6px,-7px) rotate(6deg)}}
@keyframes pulse{0%,100%{opacity:.65;transform:scale(.92)}50%{opacity:1;transform:scale(1.06)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(90px) rotate(240deg);opacity:0}}
.dc.bob{animation:bob 2.6s ease-in-out infinite}
.dc.fly{animation:fly 3.2s ease-in-out infinite}
.sunrot>g{transform-origin:0 0;animation:spin 40s linear infinite}
@media (prefers-reduced-motion: reduce){.dc.bob,.dc.fly,.glow,.sunrot>g,.conf i{animation:none}}
.dc.peekS{position:absolute;right:18px;top:-26px}
.seg2{display:inline-flex;background:#F2EDE2;border-radius:12px;padding:3px}.seg2 button{border:0;background:none;border-radius:9px;padding:6px 12px;font-weight:900;color:var(--muted)}.seg2 button.on{background:var(--p);color:#fff;box-shadow:0 2px 0 var(--pd)}

.pos b{font-weight:900}
.w1 .pos b{font-size:12.5px;font-weight:900;letter-spacing:0;line-height:1.3}.w1 .pos{align-self:center}

<script>
/* Bộ đọc .xlsx tối giản, chạy offline (ZIP + DecompressionStream + DOMParser) */
const XLSX_MINI = (() => {
  const td = new TextDecoder('utf-8');
  function u16(b, o) { return b[o] | (b[o + 1] << 8); }
  function u32(b, o) { return (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0; }

  function listZip(buf) {
    const b = new Uint8Array(buf);
    let eocd = -1;
    for (let i = b.length - 22; i >= Math.max(0, b.length - 70000); i--) {
      if (u32(b, i) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('Không phải file .xlsx hợp lệ (không tìm thấy cấu trúc ZIP).');
    const n = u16(b, eocd + 10), cdOff = u32(b, eocd + 16);
    const files = {};
    let p = cdOff;
    for (let k = 0; k < n; k++) {
      if (u32(b, p) !== 0x02014b50) break;
      const method = u16(b, p + 10), csize = u32(b, p + 20);
      const nl = u16(b, p + 28), el = u16(b, p + 30), cl = u16(b, p + 32), lho = u32(b, p + 42);
      const name = td.decode(b.subarray(p + 46, p + 46 + nl));
      files[name] = { method, csize, lho };
      p += 46 + nl + el + cl;
    }
    return { b, files };
  }

  async function inflateRaw(data) {
    if (typeof DecompressionStream === 'undefined') throw new Error('Trình duyệt quá cũ: không giải nén được file Excel. Hãy dùng Chrome, Edge hoặc Safari bản mới.');
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Blob([data]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  async function readEntry(z, name) {
    const f = z.files[name];
    if (!f) return null;
    const b = z.b, o = f.lho;
    const nl = u16(b, o + 26), el = u16(b, o + 28);
    const start = o + 30 + nl + el;
    const raw = b.subarray(start, start + f.csize);
    const out = f.method === 0 ? raw : await inflateRaw(raw);
    return td.decode(out);
  }

  function colIndex(ref) {
    let n = 0;
    for (const ch of ref) {
      const c = ch.charCodeAt(0);
      if (c >= 65 && c <= 90) n = n * 26 + (c - 64); else break;
    }
    return n - 1;
  }
  function allText(el) {
    const ts = el.getElementsByTagName('t');
    let s = '';
    for (const t of ts) s += t.textContent;
    return s;
  }

  async function read(buf) {
    const z = listZip(buf);
    const parser = new DOMParser();
    const xml = s => parser.parseFromString(s, 'application/xml');
    const wbXml = await readEntry(z, 'xl/workbook.xml');
    if (!wbXml) throw new Error('File không có workbook (không phải Excel?).');
    const relXml = await readEntry(z, 'xl/_rels/workbook.xml.rels');
    const rels = {};
    if (relXml) for (const r of xml(relXml).getElementsByTagName('Relationship')) rels[r.getAttribute('Id')] = r.getAttribute('Target');
    const ssXml = await readEntry(z, 'xl/sharedStrings.xml');
    const shared = [];
    if (ssXml) for (const si of xml(ssXml).getElementsByTagName('si')) shared.push(allText(si));
    const sheets = {};
    for (const s of xml(wbXml).getElementsByTagName('sheet')) {
      const name = s.getAttribute('name');
      const rid = s.getAttribute('r:id') || s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
      let target = rels[rid] || '';
      target = target.replace(/^\/?xl\//, '').replace(/^\//, '');
      const path = 'xl/' + target;
      const sx = await readEntry(z, path);
      if (!sx) continue;
      const doc = xml(sx);
      const rows = [];
      for (const r of doc.getElementsByTagName('row')) {
        const ri = (parseInt(r.getAttribute('r'), 10) || rows.length + 1) - 1;
        const arr = [];
        let ci = 0;
        for (const c of r.getElementsByTagName('c')) {
          const ref = c.getAttribute('r');
          if (ref) ci = colIndex(ref);
          const t = c.getAttribute('t');
          let v = null;
          if (t === 'inlineStr') v = allText(c);
          else {
            const ve = c.getElementsByTagName('v')[0];
            if (ve) {
              v = ve.textContent;
              if (t === 's') v = shared[parseInt(v, 10)] ?? '';
              else if (t === 'b') v = v === '1';
            }
          }
          arr[ci] = v;
          ci++;
        }
        rows[ri] = arr;
      }
      sheets[name] = rows.map(r => r || []);
    }
    return sheets;
  }
  return { read };
})();

function spr(name, h = 40, cls = '', style = '') {
  const s = SPR[name]; if (!s) return '';
  const [x, y, w, hh, body] = s, wd = (w / hh * h).toFixed(1);
  return `<svg class="dc sp ${cls}" width="${wd}" height="${h}" viewBox="${x} ${y} ${w} ${hh}" ${style ? `style="${style}"` : ''} aria-hidden="true" focusable="false">${body}</svg>`;
}

async function importFile(file, fromSettings) {
  if (!file) return;
  return importBuf(await file.arrayBuffer(), file.name, fromSettings);
}
async function importBuf(buf, name, fromSettings, quiet) {
  const file = { name };
  importBusy = true; importErr = ''; if (!fromSettings && !quiet) renderImport(); else if (!quiet) toast('Đang đọc file…');
  try {
    const sheets = await XLSX_MINI.read(buf);
    const ds = datasetFromSheets(sheets, file.name);
    const old = DATA ? { l: DATA.lessons.length, v: DATA.vocab.length, p: DATA.phrases.length, g: DATA.grammar.length, s: DATA.lines.length } : null;
    buildData(ds);
    const stored = await IDB.set('dataset', ds);
    importBusy = false;
    const now = { l: DATA.lessons.length, v: DATA.vocab.length, p: DATA.phrases.length, g: DATA.grammar.length, s: DATA.lines.length };
    if (quiet) { render(); toast('🌱 Đã cập nhật dữ liệu bài học mới · tiến độ giữ nguyên'); return true; }
    page = fromSettings ? 'me' : 'home'; render();
    const f = (k, n) => old && old[k] !== now[k] ? `${n} ${old[k]} → ${now[k]}` : `${now[k]} ${n}`;
    modal(`<div class="row between"><b class="h2">Đã nhập dữ liệu</b><button class="x" onclick="closeModal()">Đóng</button></div>
      <p class="small">${esc(file.name)}</p><ul class="small"><li>${f('l', 'bài')}</li><li>${f('v', 'từ vựng')}</li><li>${f('p', 'cụm từ')}</li><li>${f('g', 'điểm ngữ pháp')}</li><li>${f('s', 'câu bài khóa')}</li></ul>
      ${stored ? '<p class="muted small">Đã lưu trong trình duyệt. Lần sau mở app không cần chọn lại file.</p>' : '<p class="err small">Trình duyệt không cho lưu dữ liệu (chế độ ẩn danh?). Lần sau mở app sẽ phải chọn lại file.</p>'}
      ${old ? '<p class="muted small">Tiến độ học được giữ nguyên.</p>' : ''}<button class="btn block" onclick="closeModal()">Bắt đầu học</button>`);
    return true;
  } catch (e) {
    importBusy = false; importErr = e.message || String(e);
    if (quiet) return false;
    if (fromSettings) toast(importErr); else renderImport();
    return false;
  }
}
/* ---------- bản web (GitHub Pages): tự nạp & tự cập nhật Excel, cài như app (PWA) ---------- */
const REMOTE_XLSX = 'TuHocTiengAnh.xlsx';
function isWeb() { return /^https?:$/.test(location.protocol); }
async function remoteSync() {
  if (!isWeb()) return false;
  try {
    const h = await fetch(REMOTE_XLSX, { method: 'HEAD', cache: 'no-cache' });
    if (!h.ok) return false;
    const tag = h.headers.get('etag') || h.headers.get('last-modified') || '';
    let last = ''; try { last = localStorage.getItem('englab-remote-tag') || ''; } catch (e) { }
    if (DATA && (!tag || tag === last)) return false;
    const r = await fetch(REMOTE_XLSX, { cache: 'no-cache' }); if (!r.ok) return false;
    const ok = await importBuf(await r.arrayBuffer(), REMOTE_XLSX, false, !!DATA);
    if (ok) try { localStorage.setItem('englab-remote-tag', tag); } catch (e) { }
    return ok;
  } catch (e) { return false; }
}
function pwaInit() {
  if (!isWeb()) return;
  const add = (tag, attrs) => { const el = document.createElement(tag); Object.assign(el, attrs); document.head.appendChild(el); };
  add('link', { rel: 'manifest', href: 'manifest.webmanifest' });
  add('link', { rel: 'apple-touch-icon', href: 'icon-180.png' });
  add('meta', { name: 'apple-mobile-web-app-capable', content: 'yes' });
  add('meta', { name: 'apple-mobile-web-app-title', content: 'English Lab' });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window._bip = e; if (page === 'me') render(); });
}
function isStandalone() { return matchMedia('(display-mode: standalone)').matches || navigator.standalone; }

/* ---------- route (dấu ấn trang chủ) ---------- */
function routeSVG(pct) {
  const p = Math.max(0, Math.min(1, pct));
  // đường cong bậc hai từ (16,70) qua (180,-10) tới (344,70)
  const bx = t => (1 - t) * (1 - t) * 16 + 2 * (1 - t) * t * 180 + t * t * 344, by = t => (1 - t) * (1 - t) * 70 + 2 * (1 - t) * t * -10 + t * t * 70;
  const ang = t => Math.atan2(2 * (1 - t) * (-10 - 70) + 2 * t * (70 - -10), 2 * (1 - t) * (180 - 16) + 2 * t * (344 - 180)) * 180 / Math.PI;
  const stops = [0, 1 / 3, 2 / 3, 1].map((t, i) => `<circle cx="${bx(t).toFixed(1)}" cy="${by(t).toFixed(1)}" r="${i === 0 || i === 3 ? 4.5 : 3.5}" fill="${p >= t - 0.001 ? '#F4A11A' : '#3A4C7A'}" stroke="#1A2A55" stroke-width="2"/>`).join('');
  const x = bx(p), y = by(p);
  return `<svg class="route" viewBox="0 0 360 84" aria-hidden="true">
    <path d="M16 70 Q180 -10 344 70" fill="none" stroke="#3A4C7A" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
    <path d="M16 70 Q180 -10 344 70" fill="none" stroke="#F4A11A" stroke-width="2.5" stroke-linecap="round" pathLength="100" stroke-dasharray="${(p * 100).toFixed(1)} 200"/>
    ${stops}
    <g transform="translate(${(x - 15).toFixed(1)} ${(y - 20).toFixed(1)})">${DECO.bird(30).replace(/^<svg[^>]*>|<\/svg>$/g, '')}</g>
  </svg><div class="route-labels"><span><b>A1</b> Khởi hành</span><span>A2</span><span>B1</span><span><b>B2</b> Đích đến</span></div>`;
}

function lookupPage() {

  let list = src;
  if (lookLv) list = list.filter(x => (x['Cấp'] || levelOf(x['Bài học'])) === lookLv);
  if (q) {
    const key = x => lookTab === 'g' ? fold(x['Điểm ngữ pháp'] + ' ' + x['Công thức'] + ' ' + x['Giải thích ngắn']) : lookTab === 'p' ? fold(x['Cụm từ'] + ' ' + x['Nghĩa']) : fold(x['Từ'] + ' ' + x['Nghĩa tiếng Việt']);

    list.sort((a, b) => (head(b).startsWith(q) ? 1 : 0) - (head(a).startsWith(q) ? 1 : 0) || (head(a) === q ? -1 : 0) - (head(b) === q ? -1 : 0));
  }

}
function srsAuto() { if (!srsQ) return; const c = S.srs[srsQ.q[srsQ.i]]; if (!c || !S.settings.autoplay) return; const x = DATA.code[c.id]?.x; if (!x) return; if (c.k === 'v' && c.d === 'en') setTimeout(() => say(headword(x)), 200); if (c.k === 'p') setTimeout(() => say(x['Cụm từ']), 200); }
function srsReveal() { srsQ.show = true; render(); const c = S.srs[srsQ.q[srsQ.i]], x = DATA.code[c.id]?.x; if (c.k === 'v' && c.d === 'vi') say(headword(x)); if (c.k === 'g') say(x['Ví dụ 1 (Anh)']); }
function srsPage() {
  if (!srsQ) return reviewPage();
  const key = srsQ.q[srsQ.i], c = S.srs[key], x = DATA.code[c.id].x, show = srsQ.show;
  let front = '', back = '';
  if (c.k === 'v' && c.d === 'en') { front = `<div class="qkind">Từ này nghĩa là gì?</div><div class="qprompt">${esc(x['Từ'])}</div><div class="ipa">${esc(x['IPA (giọng Mỹ)'] || '')}</div><div>${sndBtn(headword(x))}</div>`; back = `<div class="vmean" style="font-size:18px"><b>${esc(x['Nghĩa tiếng Việt'])}</b></div><div class="pos">${esc(x['Từ loại'])}</div>${x['Ví dụ 1 (Anh)'] ? `<p class="small">${esc(x['Ví dụ 1 (Anh)'])}<br><span class="muted">${esc(x['Ví dụ 1 (Việt)'])}</span></p>` : ''}`; }
  else if (c.k === 'v') { front = `<div class="qkind">Nói từ tiếng Anh</div><div class="qprompt long">${esc(x['Nghĩa tiếng Việt'])}</div><div class="pos">${esc(x['Từ loại'])}</div>`; back = `<div class="qprompt">${esc(x['Từ'])}</div><div class="ipa">${esc(x['IPA (giọng Mỹ)'] || '')}</div><div>${sndBtn(headword(x))}</div>`; }
  else if (c.k === 'p') { front = `<div class="qkind">Cụm này nghĩa là gì, dùng khi nào?</div><div class="qprompt long">${esc(x['Cụm từ'])}</div><div>${sndBtn(x['Cụm từ'])}</div>`; back = `<div class="vmean" style="font-size:17px"><b>${esc(x['Nghĩa'])}</b></div>${x['Ví dụ 1 (Anh)'] ? `<p class="small">${esc(x['Ví dụ 1 (Anh)'])}<br><span class="muted">${esc(x['Ví dụ 1 (Việt)'])}</span></p>` : ''}`; }
  else { front = `<div class="qkind">Ngữ pháp · nói câu tiếng Anh</div><div class="small muted" style="margin:6px 0">${esc(x['Điểm ngữ pháp'])}</div><div class="qprompt long">${esc(x['Ví dụ 1 (Việt)'] || '')}</div>`; back = `<div class="qprompt long" style="color:var(--blue)">${esc(x['Ví dụ 1 (Anh)'] || '')}</div>${x['Công thức'] ? `<div class="formula" style="text-align:left">${esc(x['Công thức'])}</div>` : ''}`; }
  const prev = [0, 3, 4, 5].map(g => ivText(sm2(c, g).iv));
  return `<div class="qtop"><button class="back" onclick="srsQ=null;go('review')">✕</button><div class="bar"><i style="width:${srsQ.i / srsQ.q.length * 100}%"></i></div><span class="muted small">${srsQ.i + 1}/${srsQ.q.length}</span></div>
   <div class="qcard srs-face">${c.due === null ? '<div><span class="badge warn">Thẻ mới</span></div>' : ''}${front}${show ? `<hr style="border:0;border-top:1px solid var(--line);margin:14px 0">${back}` : ''}</div>
   ${show ? `<div class="grades"><button class="g0" onclick="gradeCard(0)">Quên<small>${prev[0]}</small></button><button class="g3" onclick="gradeCard(3)">Khó<small>${prev[1]}</small></button><button class="g4" onclick="gradeCard(4)">Nhớ<small>${prev[2]}</small></button><button class="g5" onclick="gradeCard(5)">Dễ<small>${prev[3]}</small></button></div>
   <p class="muted tiny" style="text-align:center">Số dưới mỗi nút = lần ôn tiếp theo</p>` : `<div style="padding:0 16px"><button class="btn amber block" onclick="srsReveal()">Hiện đáp án</button><p class="muted tiny" style="text-align:center">Tự nhớ (hoặc nói to) đáp án trước rồi mới mở.</p></div>`}
   <div style="padding:6px 16px"><button class="chip" onclick="openItem('${c.id}')">Xem chi tiết</button></div>`;
}
function reviewPage() {
  const cnt = k => Object.values(S.srs).filter(c => k === 'all' || c.k === k).length;
  const l = srsLists('all');
  const fut = [...Array(7)].map((_, i) => Object.values(S.srs).filter(c => c.due === today() + i + 1).length);
  const errN = Object.keys(S.errors).length;
  return `<div class="band compact"><h1>Ôn tập</h1><div class="sub">Ôn ngắt quãng SM-2 · nhớ lâu, ôn đúng lúc sắp quên</div></div><div class="page">
   <section class="card"><div class="stats3"><div><b>${l.due.length}</b><span>đến hạn hôm nay</span></div><div><b>${l.fresh.length}</b><span>thẻ mới hôm nay</span></div><div><b>${cnt('all')}</b><span>tổng số thẻ</span></div></div>
   <button class="btn amber block mt" onclick="startSrs('all')" ${l.due.length + l.fresh.length ? '' : 'disabled'}>${l.due.length + l.fresh.length ? `Bắt đầu ôn ${l.due.length + l.fresh.length} thẻ` : 'Hôm nay đã ôn xong 🎉'}</button>
   <div class="chips mt">${[['v', 'Chỉ từ vựng'], ['p', 'Chỉ cụm từ'], ['g', 'Chỉ ngữ pháp']].map(([k, t]) => { const x = srsLists(k); const n = x.due.length + x.fresh.length; return `<button class="chip" ${n ? '' : 'disabled'} onclick="startSrs('${k}')">${t} (${n})</button>`; }).join('')}</div></section>
   ${cnt('all') ? `<section class="card"><div class="section-title">7 ngày tới</div><div class="bars">${fut.map((n, i) => `<div><i style="height:${Math.round(n / Math.max(1, ...fut) * 52)}px;background:var(--blue)"></i><span>${dayKey(today() + i + 1).slice(8)}</span></div>`).join('')}</div><div class="muted tiny" style="text-align:center">Số thẻ đến hạn mỗi ngày</div></section>` :
      `<section class="card"><p class="small" style="margin:0">Chưa có thẻ nào. Trong mỗi bài, bấm <b>“Tôi đã học xong phần Từ vựng / Ngữ pháp”</b> để đưa các mục vào ôn tập.</p></section>`}
   <button class="ptype" onclick="startErrors()"><span class="ic coral">✓</span><span><b>Sổ lỗi sai</b><span>Các câu bạn từng làm sai trong bài tập</span></span><span class="badge ${errN ? 'warn' : ''}">${errN}</span></button>
   <p class="muted tiny">Mẹo: “Quên” = thẻ quay lại ngay trong lượt này; “Khó/Nhớ/Dễ” = giãn dần khoảng cách. Thẻ mới mỗi ngày tối đa ${S.settings.newLimit} (đổi trong mục Tôi). Còn ${l.freshAll} thẻ mới chưa học.</p></div>`;
}

(async function boot() {
  applyTheme();
  await IDB.open();
  try { const ds = await IDB.get('dataset'); if (ds && ds.sheets) buildData(ds); } catch (e) { DATA = null; }
  if (DATA) lessonId = currentLessonId();
  pwaInit();
  if (!DATA && isWeb()) { importBusy = true; render(); const ok = await remoteSync(); if (!ok) { importBusy = false; render(); } }
  else { render(); if (DATA) remoteSync(); }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
})();
</script>
</body>
</html>
