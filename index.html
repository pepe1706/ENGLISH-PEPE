  return `<section class="card"><div class="section-title">🔑 Quản trị mã truy cập</div>
   <p class="small muted" style="margin-top:0">Bạn đang ở chế độ quản trị. Tạo mã cho người học, thu hồi, gỡ máy khi họ đổi điện thoại.</p>
   <div class="grid2"><button class="btn amber" onclick="admOpen()">Quản lý mã</button><button class="btn ghost" onclick="if(confirm('Thoát chế độ quản trị trên máy này? Bạn cần nhập lại mã quản trị để vào.')){gateDrop();gateTab='user';gateScreen();gateResolve=()=>render();}">Thoát quản trị</button></div></section>`;
}
function gateFoot() { return GATE && GATE.role === 'user' ? ` · mã của <b>${esc(GATE.name || 'bạn')}</b>` : GATE && GATE.role === 'admin' ? ' · quản trị' : ''; }

let ADM = { list: null, err: '', busy: false, fresh: '', f: 'all' };
const admState = c => c.off ? 'off' : c.device ? 'use' : 'free';
function admFilter(f) { ADM.f = f; admDraw(); }
function admOpen() { ADM = { list: null, err: '', busy: true, fresh: '', f: 'all' }; admDraw(); admLoad(); }
async function admLoad() {
  ADM.busy = true; admDraw();
  const r = await gateApi('/admin/list', undefined, GATE.admin);
  ADM.busy = false;
  if (r.s === 200) { ADM.list = r.j.codes || []; ADM.err = ''; }
  else if (r.s === 401) { ADM.err = 'Mã quản trị không còn đúng (có thể đã đổi trên Cloudflare). Hãy thoát quản trị và nhập mã mới.'; }
  else ADM.err = r.s === 0 ? GATE_MSG.network : GATE_MSG.server;
  admDraw();
}
async function admPost(path, body) {
  if (ADM.busy) return null; ADM.busy = true; admDraw();
  const r = await gateApi(path, body, GATE.admin); ADM.busy = false;
  if (r.s === 200) { ADM.err = ''; if (r.j.codes) ADM.list = r.j.codes; return r.j; }
  ADM.err = r.s === 401 ? 'Mã quản trị không còn đúng.' : r.s === 0 ? GATE_MSG.network : 'Không thực hiện được (' + ((r.j && r.j.error) || r.s) + ').';
  admDraw(); return null;
}
async function admCreate() {
  const i = $('#admName'), n = (i && i.value || '').trim(); if (!n) { toast('Gõ tên người dùng trước'); return; }
  const j = await admPost('/admin/create', { n });
  if (j && j.rec) { ADM.fresh = j.rec.h; await admLoad(); }
}
async function admAct(h, action) {
  const rec = (ADM.list || []).find(c => c.h === h); if (!rec) return;
  const ask = { revoke: `Thu hồi mã của “${rec.n}”? Họ bị khóa ở lần mở app có mạng tiếp theo.`, unbind: `Gỡ máy của “${rec.n}”? Họ sẽ nhập lại mã trên máy mới.`, delete: `Xóa hẳn mã của “${rec.n}”? Không hoàn tác được.` }[action];
  if (ask && !confirm(ask)) return;
  if (await admPost('/admin/update', { h, action })) { admDraw(); toast({ revoke: 'Đã thu hồi', restore: 'Đã mở lại', unbind: 'Đã gỡ máy', delete: 'Đã xóa' }[action] || 'Xong'); }
}
async function admRename(h) {
  const rec = (ADM.list || []).find(c => c.h === h); if (!rec) return;
  const n = prompt('Tên mới:', rec.n); if (n == null || !n.trim()) return;
  if (await admPost('/admin/update', { h, action: 'rename', n: n.trim() })) admDraw();
}
function admMsg(code, name) { return `Chào ${name}, mã truy cập English Lab của bạn là: ${code}\nMở ${location.origin}${location.pathname} rồi nhập mã. Mỗi mã chỉ dùng được trên một điện thoại.`; }
async function admCopy(h, whole) {
  const rec = (ADM.list || []).find(c => c.h === h); if (!rec) return;
  const txt = whole ? admMsg(rec.code, rec.n) : rec.code;
  try { await navigator.clipboard.writeText(txt); toast(whole ? 'Đã chép tin nhắn kèm mã' : 'Đã chép mã'); }
  catch (e) { prompt('Chép mã này:', txt); }
}
function admDraw() {
  const d = n => { try { return new Date(n).toLocaleDateString('vi-VN'); } catch (e) { return ''; } };
  const all = ADM.list || [], cnt = { all: all.length, use: 0, free: 0, off: 0 };
  all.forEach(c => cnt[admState(c)]++);
  const FL = [['all', 'Tất cả'], ['use', 'Đang dùng'], ['free', 'Chưa dùng'], ['off', 'Đã thu hồi']];
  const rows = all.filter(c => ADM.f === 'all' || admState(c) === ADM.f).slice().reverse().map(c => {
    const stt = admState(c);
    const st = stt === 'off' ? '<span class="badge" style="background:var(--coral-soft);color:var(--coral)">Đã thu hồi</span>' : stt === 'use' ? `<span class="badge ok">Đang dùng${c.boundAt ? ' · từ ' + d(c.boundAt) : ''}</span>` : '<span class="badge" style="background:var(--amber-soft);color:#9A5B00">Chưa dùng</span>';
    const h = ja(c.h);
    return `<div class="admrow ${ADM.fresh === c.h ? 'fresh' : ''}"><div class="row between wrap"><b>${esc(c.n)}</b>${st}</div>
     <div class="row between wrap" style="margin-top:4px"><code class="admcode">${esc(c.code)}</code><span class="muted tiny">tạo ${esc(c.c || '')}</span></div>
     <div class="admbtn"><button class="chip" onclick='admCopy(${h},true)'>📋 Chép tin nhắn</button><button class="chip" onclick='admCopy(${h})'>Chép mã</button>
     <button class="chip" onclick='admAct(${h},"${c.off ? 'restore' : 'revoke'}")'>${c.off ? 'Mở lại' : 'Thu hồi quyền'}</button>
     ${c.device ? `<button class="chip" onclick='admAct(${h},"unbind")'>Gỡ máy</button>` : ''}<button class="chip" onclick='admRename(${h})'>Đổi tên</button><button class="chip" onclick='admAct(${h},"delete")'>🗑 Xóa mã</button></div></div>`;
  }).join('');
  modal(`<div class="row between"><div class="section-title" style="margin:0">🔑 Quản trị mã truy cập</div><div class="row" style="gap:6px"><button class="x" onclick="admLoad()" ${ADM.busy ? 'disabled' : ''}>↻</button><button class="x" onclick="closeModal()">Đóng</button></div></div>
   <div class="admsum"><div><b>${cnt.all}</b><span>tổng mã</span></div><div><b>${cnt.use}</b><span>đang dùng</span></div><div><b>${cnt.free}</b><span>chưa dùng</span></div><div><b>${cnt.off}</b><span>thu hồi</span></div></div>
   <p class="muted tiny" style="margin:0 0 6px">Bạn (admin) vào học bằng mã quản trị, không cần tạo mã cho mình. Tạo mã bên dưới chỉ để gửi cho người học.</p>
   <form class="row" onsubmit="event.preventDefault();admCreate()" autocomplete="off"><input id="admName" class="gin2" placeholder="Tên người dùng, ví dụ Em Lan" maxlength="40"><button class="btn amber" type="submit" ${ADM.busy ? 'disabled' : ''}>Tạo mã</button></form>
   ${ADM.err ? `<div class="note err mt">${esc(ADM.err)}</div>` : ''}
   <div class="admf">${FL.map(([k, t]) => `<button class="chip ${ADM.f === k ? 'on' : ''}" onclick="admFilter('${k}')">${t} ${cnt[k]}</button>`).join('')}</div>
   ${ADM.busy && !ADM.list ? '<div class="empty">Đang tải…</div>' : ''}
   <div>${ADM.list && !rows ? `<div class="empty">${all.length ? 'Không có mã nào ở mục này.' : 'Chưa có mã nào. Gõ tên rồi bấm Tạo mã.'}</div>` : rows}</div>
   <p class="muted tiny">Thu hồi / gỡ máy / xóa có hiệu lực ở lần người đó mở app (hoặc quay lại app) có mạng tiếp theo.</p>`);
  const bg = $('#modal .modalbg'); if (bg) bg.classList.add('adm');
}

/* ===== v6.2 · hạt rơi mờ trên mọi màn hình (lá; v6.4: tuyết / cánh hoa / trái tim theo giao diện). Chỉ trang trí, không chặn chạm ===== */
const LEAF_KINDS = {
  leaf: ['#8CCB93', '#A9D98A', '#F2B65A', '#F0997A', '#74BF8B', '#D9C26A'],
  snow: ['#A9CCE8', '#8EC0E6', '#BCD8EE'],
  petal: ['#FFD43B', '#FF9DB8', '#FFC233', '#FFB3C6'],
  heart: ['#FF6F91', '#F0587C', '#FFA3BA']
};
function leavesBuild(kind) {
  try {
    kind = LEAF_KINDS[kind] ? kind : 'leaf';
    let box = document.getElementById('leaves');
    if (!box) { box = document.createElement('div'); box.id = 'leaves'; box.setAttribute('aria-hidden', 'true'); document.body.appendChild(box); }
    box.className = 'k-' + kind;
    const COL = LEAF_KINDS[kind], N = 14; let h = '';
    for (let i = 0; i < N; i++) {
      const left = (i * 100 / N + (i * 37 % 7) * 1.3).toFixed(1), size = 12 + (i * 5) % 11, dur = 15 + (i * 7) % 11, delay = -((i * 53) % 26), sway = 18 + (i * 13) % 30, sd = 3.4 + (i % 4) * .8;
      h += `<i class="lf" style="left:${left}%;width:${size}px;height:${size}px;font-size:${Math.round(size * 1.25)}px;animation-duration:${dur}s;animation-delay:${delay}s"><b style="--sw:${i % 2 ? sway : -sway}px;--c:${COL[i % COL.length]};animation-duration:${sd}s;animation-delay:${-(i % 5)}s"></b></i>`;
    }
    box.innerHTML = h;
  } catch (e) { }
}
leavesBuild('leaf');

(async function boot() {
  applyTheme(); try { applyFontSize(); } catch (e) { }
  await IDB.open();
  await gateStart();   // chưa nhập mã hợp lệ thì dừng ở đây (chỉ khi chạy trên web)
  try { const ds = await IDB.get('dataset'); if (ds && ds.sheets) buildData(ds); } catch (e) { DATA = null; }
  if (DATA) lessonId = currentLessonId();
  pwaInit();
  if (!DATA && isWeb()) { importBusy = true; render(); const ok = await remoteSync(); if (!ok) { importBusy = false; render(); } }
  else { render(); if (DATA) remoteSync(); }
  setTimeout(() => { try { questOnOpen(); } catch (e) { } }, 1100);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
})();
</script>
